# Alertmanager configuration for NeoPro
#
# Setup:
#   1. Set SLACK_WEBHOOK_URL in .env (or replace placeholder below)
#   2. docker compose up alertmanager prometheus grafana
#
# Routes:
#   critical → slack #neopro-alerts (immediate)
#   warning  → slack #neopro-alerts (grouped, 5min wait)

global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"

route:
  receiver: slack-default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts: notify immediately, repeat every 1h
    - match:
        severity: critical
      receiver: slack-critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: slack-default
    slack_configs:
      - channel: '#neopro-alerts'
        send_resolved: true
        title: '{{ if eq .Status "resolved" }}[RESOLVED]{{ else }}[{{ .CommonLabels.severity | toUpper }}]{{ end }} {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        actions:
          - type: button
            text: 'Grafana'
            url: 'https://grafana.neopro.tv'
          - type: button
            text: 'Railway'
            url: 'https://railway.app'

  - name: slack-critical
    slack_configs:
      - channel: '#neopro-alerts'
        send_resolved: true
        title: ':rotating_light: [CRITICAL] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          ---
          {{ end }}
        actions:
          - type: button
            text: 'Grafana'
            url: 'https://grafana.neopro.tv'
          - type: button
            text: 'Railway Logs'
            url: 'https://railway.app'

# Inhibition: if server is completely down, suppress per-metric warnings
inhibit_rules:
  - source_match:
      alertname: CentralServerDown
    target_match:
      severity: warning
    equal: ['job']
