# Prometheus configuration for NeoPro
# Scrape local dev, Docker, and production targets

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    monitor: 'neopro-monitor'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # NeoPro Central Server (Docker - profile full)
  - job_name: 'neopro-central-server'
    static_configs:
      - targets: ['central-server:3001']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # NeoPro Central Server (local dev - npm run dev)
  - job_name: 'neopro-local'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # NeoPro Production (Railway)
  - job_name: 'neopro-production'
    scheme: https
    static_configs:
      - targets: ['neopro-central-production.up.railway.app']
        labels:
          environment: 'production'
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Node Exporter (optional - for host metrics)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # PostgreSQL Exporter (optional)
  # - job_name: 'postgres-exporter'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis Exporter (optional)
  # - job_name: 'redis-exporter'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
