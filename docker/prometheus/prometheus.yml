# Prometheus configuration for NeoPro
# Local dev only — production monitoring is handled by Grafana Cloud
#
# Usage:
#   docker compose up prometheus grafana   → local dev monitoring
#   Grafana Cloud                          → production monitoring (scrape job configured in cloud UI)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  external_labels:
    monitor: 'neopro-monitor'

# Alert rules
rule_files:
  - /etc/prometheus/rules.yml

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NeoPro Central Server (Docker - profile full)
  - job_name: 'neopro-central-server'
    static_configs:
      - targets: ['central-server:3001']
    scrape_interval: 10s
    scrape_timeout: 5s

  # NeoPro Central Server (local dev - npm run dev)
  - job_name: 'neopro-local'
    static_configs:
      - targets: ['host.docker.internal:3001']
    scrape_interval: 10s
    scrape_timeout: 5s
