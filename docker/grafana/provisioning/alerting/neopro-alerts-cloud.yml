# Grafana Cloud Alert Rules for NeoPro
#
# Import method:
#   Grafana Cloud UI → Alerting → Alert rules → Import
#   OR use Grafana provisioning API:
#   curl -X POST https://<instance>.grafana.net/api/v1/provisioning/alert-rules \
#     -H "Authorization: Bearer $GRAFANA_SA_TOKEN" \
#     -H "Content-Type: application/json" \
#     -d @<rule.json>
#
# Datasource: grafanacloud-tallec7-prom
# Contact point: Configure Slack webhook in Grafana Cloud → Alerting → Contact points

apiVersion: 1

groups:
  # =============================================
  # CRITICAL — Server & Connectivity
  # =============================================
  - orgId: 1
    name: NeoPro - Critical
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # Central Server unreachable
      - uid: neopro-server-down
        title: Central Server Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: up{job=~"neopro.*"}
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 2m
        labels:
          severity: critical
          team: neopro
        annotations:
          summary: "Central Server is DOWN"
          description: "Prometheus cannot scrape the central server for 2 minutes. Check Railway deployment."

      # Zero Pi heartbeats
      - uid: neopro-zero-heartbeats
        title: Zero Pi Heartbeats
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_heartbeats_total[5m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.001]
              refId: C
        for: 5m
        labels:
          severity: critical
          team: neopro
        annotations:
          summary: "Zero Pi heartbeats for 5 minutes"
          description: "No heartbeats received. All Pi disconnected or WebSocket is broken."

      # No agent WebSocket connections
      - uid: neopro-no-agents
        title: No Pi Agents Connected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_websocket_connections{type="agent"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 5m
        labels:
          severity: critical
          team: neopro
        annotations:
          summary: "No Pi agents connected"
          description: "Zero agent WebSocket connections for 5 minutes."

  # =============================================
  # WARNING — Performance & Resources
  # =============================================
  - orgId: 1
    name: NeoPro - Warnings
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # High HTTP error rate
      - uid: neopro-high-error-rate
        title: High HTTP 5xx Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "HTTP 5xx error rate above 5%"
          description: "More than 5% of API requests are returning server errors."

      # High API latency
      - uid: neopro-high-latency
        title: High API Latency (P95)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "P95 API latency above 3s"
          description: "95th percentile response time exceeds 3 seconds."

      # High memory usage
      - uid: neopro-high-memory
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: process_resident_memory_bytes / (256 * 1024 * 1024)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.88]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Memory usage above 88%"
          description: "Heap approaching 256MB limit. OOM risk."

      # DB pool saturation
      - uid: neopro-db-pool-saturation
        title: DB Pool Saturation
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_db_connections{state="active"} / neopro_db_connections{state="total"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        for: 3m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "DB pool saturation above 80%"
          description: "Active connections approaching pool limit. Risk of exhaustion."

      # Slow DB queries
      - uid: neopro-slow-queries
        title: Slow DB Queries (P95)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: histogram_quantile(0.95, rate(neopro_db_query_duration_seconds_bucket[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "P95 DB query latency above 2s"
          description: "Database queries are slow. Check for missing indexes or heavy queries."

      # High WebSocket disconnect rate
      - uid: neopro-high-disconnects
        title: High WebSocket Disconnect Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_websocket_disconnects_total[5m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 3m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "High WebSocket disconnect rate"
          description: "More than 0.5 disconnections/sec. Possible network instability."

      # Too many active alerts
      - uid: neopro-too-many-alerts
        title: Too Many Active Alerts
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_active_alerts
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        for: 10m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "More than 10 active alerts"
          description: "Possible fleet-wide issue. Check Pi fleet status."

  # =============================================
  # CRITICAL — Server Health (missing from cloud)
  # =============================================
  - orgId: 1
    name: NeoPro - Server Health
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # Server responding but health endpoint failing
      - uid: neopro-server-unhealthy
        title: Central Server Unhealthy
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_health_status
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 3m
        labels:
          severity: critical
          team: neopro
        annotations:
          summary: "Central Server health check failing"
          description: "Health endpoint returns unhealthy for 3 minutes. Server is up but degraded."

      # High CPU usage (event loop saturation)
      - uid: neopro-high-cpu
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(process_cpu_seconds_total[5m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "CPU usage sustained above 80%"
          description: "Event loop may be saturated. Check for blocking operations."

  # =============================================
  # WARNING — Connectivity (missing from cloud)
  # =============================================
  - orgId: 1
    name: NeoPro - Connectivity
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # Sudden drop in connected sites (fleet issue)
      - uid: neopro-sites-drop
        title: Connected Sites Drop 50%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_connected_sites_total < (neopro_connected_sites_total offset 10m) * 0.5 and neopro_connected_sites_total offset 10m > 3
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Connected sites dropped by 50%+"
          description: "Fleet-wide disconnection detected. Check network or server-side WebSocket."

  # =============================================
  # WARNING — Database Size (missing from cloud)
  # =============================================
  - orgId: 1
    name: NeoPro - Database Size
    folder: NeoPro Alerts
    interval: 5m
    rules:
      # Database approaching Supabase free tier quota (500 MB)
      - uid: neopro-db-size-warning
        title: Database Size Warning (400 MB)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_db_size_bytes
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [419430400]
              refId: C
        for: 10m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Database size above 400 MB (Supabase free tier: 500 MB)"
          description: "Consider running cleanup or reducing retention."

      # Database size critical — approaching hard limit
      - uid: neopro-db-size-critical
        title: Database Size Critical (475 MB)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_db_size_bytes
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [497025024]
              refId: C
        for: 5m
        labels:
          severity: critical
          team: neopro
        annotations:
          summary: "Database size above 475 MB — approaching Supabase 500 MB hard limit"
          description: "Immediate action required: VACUUM FULL or reduce retention."

      # Single table consuming too much space
      - uid: neopro-db-table-size
        title: Database Table Size High (200 MB)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_db_table_size_bytes
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [209715200]
              refId: C
        for: 30m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "A database table exceeds 200 MB"
          description: "Check retention policy for the affected table."

  # =============================================
  # WARNING — Video Uploads (missing from cloud)
  # =============================================
  - orgId: 1
    name: NeoPro - Video Uploads
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # High upload failure rate
      - uid: neopro-upload-failures
        title: High Video Upload Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_video_uploads_total{status="failed"}[10m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "High video upload failure rate"
          description: "More than 3 upload failures per minute over 10 minutes."

      # Frequent filename encoding corrections
      - uid: neopro-encoding-corrections
        title: Frequent Filename Encoding Corrections
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_filename_encoding_corrections_total[1h])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
              refId: C
        for: 30m
        labels:
          severity: info
          team: neopro
        annotations:
          summary: "Frequent filename encoding corrections"
          description: "Many uploads have non-ASCII filenames being corrected. Check client-side encoding."

  # =============================================
  # WARNING — FTP Storage Health
  # =============================================
  - orgId: 1
    name: NeoPro - FTP Storage
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # FTP verification failure rate (detects regression on verify logic)
      - uid: neopro-ftp-verify-failures
        title: FTP Verification Failure Rate High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: |
                (
                  sum(rate(neopro_ftp_operations_total{operation="verify", status=~"failed|not_found"}[30m]))
                  /
                  clamp_min(sum(rate(neopro_ftp_operations_total{operation="verify"}[30m])), 0.001)
                ) > 0.5
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "FTP verification failure rate > 50%"
          description: "More than half of FTP upload verifications are failing over 30 minutes. This may indicate an FTP server issue or a regression in verifyFtpFileExists() (e.g. root-listing bug). Check ftp-storage.ts and FTP server health."

      # FTP excessive retries (detects wasted bandwidth from failed verifications)
      - uid: neopro-ftp-excessive-retries
        title: FTP Excessive Retries
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_ftp_retries_total[30m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
              refId: C
        for: 15m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "FTP retry rate elevated"
          description: "FTP retries are elevated (>6/hour). Each retry re-uploads the entire file, wasting bandwidth. Check FTP verification logic and server stability."

  # =============================================
  # WARNING — Sponsor Analytics (P6-P8)
  # =============================================
  - orgId: 1
    name: NeoPro - Sponsor Analytics
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # Network stats cross-club query latency (P6.1)
      - uid: neopro-slow-network-sponsor
        title: Slow Network Sponsor Stats (P95)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: histogram_quantile(0.95, rate(neopro_http_request_duration_seconds_bucket{path=~"/api/network/advertisers/.*/stats"}[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "P95 network sponsor stats latency above 5s"
          description: "Cross-club aggregation queries are slow. Consider adding indexes or caching."

      # Benchmark query latency (P6.2)
      - uid: neopro-slow-benchmark
        title: Slow Sponsor Benchmark Query (P95)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: histogram_quantile(0.95, rate(neopro_http_request_duration_seconds_bucket{path=~"/api/sites/.*/sponsors/benchmark"}[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "P95 sponsor benchmark latency above 3s"
          description: "Benchmark query scanning all site sponsors is slow."

      # PDF report generation failures (P6.4)
      - uid: neopro-report-failures
        title: High Sponsor Report Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_report_generations_total{report_type="site_sponsor",status="failed"}[15m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.02]
              refId: C
        for: 10m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "High site_sponsor PDF report failure rate"
          description: "More than 1 PDF generation failure per minute. Check match breakdown data."

      # Sponsor sync missing from deployments (P8)
      - uid: neopro-sponsor-sync-missing
        title: Sponsor Sync Missing from Deployments
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_sponsor_sync_total{status="included"}[1h]) == 0 and rate(neopro_deployments_total{status="completed"}[1h]) > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 30m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Config deployments happening without sponsor sync"
          description: "Deployments are completing but no sponsor data is being synced."

      # Sponsor resolution failures
      - uid: neopro-sponsor-resolution
        title: Elevated Sponsor Resolution Failures
        condition: C
