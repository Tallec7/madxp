        for: 10m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Elevated sponsor resolution failures"
          description: "Check config-sync.handler or advertiser-analytics.controller."

      # Over 50% impressions without sponsor attribution
      - uid: neopro-impressions-unresolved
        title: Impressions Without Sponsor Attribution
        condition: C
        data:
