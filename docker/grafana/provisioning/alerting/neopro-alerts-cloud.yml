          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        for: 15m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Over 50% of impressions without sponsor attribution"
          description: "Check site_sponsor_videos table and loop manager config."

      # Pi agent authentication failures
      - uid: neopro-pi-auth-failures
        title: High Pi Agent Auth Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_pi_agent_auth_total{status="failure"}[5m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "High Pi agent auth failure rate"
          description: "Possible DB pool exhaustion or server overload."

      # Analytics video-plays 500 errors
      - uid: neopro-analytics-500
        title: High Analytics 500 Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(http_requests_total{method="POST",path="/api/analytics/video-plays",status_code="500"}[10m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.02]
              refId: C
        for: 10m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "High 500 error rate on analytics video-plays endpoint"
          description: "Check DB schema and pool connections."

      # FK fallback on video_plays
      - uid: neopro-fk-fallback
        title: High Video Plays FK Fallback Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_video_plays_fk_fallback_total[30m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
              refId: C
        for: 15m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Elevated FK fallback rate on video_plays"
          description: "Pi may be sending stale references to deleted records."

      # Report endpoint validation errors
      - uid: neopro-report-validation
        title: Report Generation Validation Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(http_requests_total{method="POST",path="/reports/generate",status_code="400"}[10m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.01]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Repeated 400 errors on POST /reports/generate"
          description: "Likely frontend sending wrong parameter format (snake_case vs camelCase)."

      # KPIs endpoint latency (consolidated pipeline)
      - uid: neopro-kpis-slow
        title: Slow Advertiser KPIs Endpoint (P95)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: histogram_quantile(0.95, rate(neopro_http_request_duration_seconds_bucket{path=~"/api/analytics/advertisers/.*/kpis"}[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
