              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "P95 advertiser KPIs endpoint latency above 5s"
          description: "Consolidated pipeline KPIs query is slow. Check video_plays indexes."

      # Campaign data inconsistency
      - uid: neopro-campaign-fk
        title: Campaign Data Inconsistency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: rate(neopro_video_plays_fk_fallback_total{column="campaign_id"}[30m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
              refId: C
        for: 15m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "video_plays referencing deleted campaigns"
          description: "Check campaign lifecycle management."

      # Verified impressions quality dropoff
      - uid: neopro-verified-impressions-drop
        title: Verified Impressions (TV-on) Dropoff
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: sum(rate(neopro_video_plays_total{category="sponsor",tv_status="on"}[1h])) / sum(rate(neopro_video_plays_total{category="sponsor"}[1h]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.1]
              refId: C
        for: 30m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Verified impressions (TV-on) rate below 10%"
          description: "Possible HDMI-CEC detection issue across fleet."

  # =============================================
  # WARNING — Predictive Alerts Meta
  # =============================================
  - orgId: 1
    name: NeoPro - Predictive Meta
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # Predictive checks failing
      - uid: neopro-predictive-checks-failing
        title: Predictive Checks Failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: increase(neopro_predictive_checks_total{status="failed"}[2h])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
              refId: C
        for: 10m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Predictive alert checks failing"
          description: "Failed predictive check runs in the last 2 hours. Check predictive-alerts.service.ts logs."

      # Burst of predictive alerts
      - uid: neopro-high-predictive-alert-rate
        title: High Predictive Alert Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: increase(neopro_predictive_alerts_generated_total[2h])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
              refId: C
        for: 10m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "High volume of predictive alerts generated"
          description: "More than 20 predictive alerts in 2 hours. Possible fleet-wide issue (orphaned videos after mass deployment, subscription wave, etc.)."

  # =============================================
  # RATE LIMITING — Dashboard UX protection
  # =============================================
  - orgId: 1
    name: NeoPro - Rate Limiting
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # Rate limit hits spike — any limiter
      - uid: neopro-rate-limit-spike
        title: Rate Limit Hits Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: sum(increase(neopro_rate_limit_hits_total[5m])) by (limiter)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: max
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Rate limit violations detected (>10 hits in 5min)"
          description: "A rate limiter is actively rejecting requests. Check which limiter via label. Sustained 429s degrade dashboard UX and can cascade to frontend logging endpoints."

      # Admin rate limit near exhaustion — early warning for sponsor routes
      - uid: neopro-admin-rate-limit-near-exhaustion
        title: Admin Rate Limit Near Exhaustion
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: increase(neopro_rate_limit_near_exhaustion_total{limiter="admin"}[5m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Admin rate limiter near exhaustion (>80% consumed)"
          description: "The admin rate limiter (used by sponsor routes) is frequently near its 400 req/min limit. A user with many sponsors may soon hit 429 errors."

  # =============================================
  # KIOSK — Chromium GPU Health (Pi 5)
  # =============================================
  - orgId: 1
    name: NeoPro - Kiosk Health
    folder: NeoPro Alerts
    interval: 1m
    rules:
      # Kiosk Chromium crash detected (critical)
      - uid: neopro-kiosk-crash
        title: Kiosk Chromium Crash
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: increase(neopro_kiosk_crashes_total[10m])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 0s
        labels:
          severity: critical
          team: neopro
        annotations:
          summary: "Kiosk Chromium crash detected"
          description: "A Pi kiosk Chromium process has crashed. Check kiosk-watchdog logs: journalctl -u neopro-kiosk -n 50. If repeated, GPU state may be corrupted — power cycle the Pi."

      # Kiosk unstable — repeated crashes (warning)
      - uid: neopro-kiosk-unstable
        title: Kiosk Chromium Unstable (repeated crashes)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: increase(neopro_kiosk_crashes_total[1h])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Kiosk unstable — >3 crashes in 1 hour"
          description: "The kiosk Chromium process has crashed more than 3 times in the last hour. Likely cause: GPU V3D state corruption after SIGKILL. Power cycle the Pi to reset GPU state."

      # Kiosk down — Chromium not running (critical)
      - uid: neopro-kiosk-down
        title: Kiosk Chromium Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_kiosk_status
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 3m
        labels:
          severity: critical
          team: neopro
        annotations:
          summary: "Kiosk Chromium is DOWN"
          description: "The kiosk Chromium process is not running for 3+ minutes. The TV display is blank. Check Pi connectivity and kiosk service: systemctl status neopro-kiosk."

      # Kiosk high restart count (warning)
      - uid: neopro-kiosk-high-restarts
        title: Kiosk High Restart Count
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: neopro_kiosk_restart_count
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        for: 5m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Kiosk Chromium restart count elevated (>5)"
          description: "A Pi has restarted Chromium kiosk more than 5 times. Possible GPU crash or memory issue."

      # Content deployment stuck (no progress events for 30min)
      # Auto-completion at 100% is handled by alerting.service.ts,
      # but deployments genuinely stuck below 100% need operator attention.
      - uid: neopro-content-deploy-stuck
        title: Content Deployment Stuck
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: grafanacloud-tallec7-prom
            model:
              expr: increase(neopro_deploy_progress_events_total{type="content",status="in_progress"}[1h]) + increase(neopro_deploy_progress_events_total{type="content",status="completed"}[1h])
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 30m
        labels:
          severity: warning
          team: neopro
        annotations:
          summary: "Content deployments may be stuck"
          description: "No content deploy progress events for 30 minutes. Check content_deployments table for stuck rows and Pi connectivity."
          description: "The kiosk watchdog has restarted Chromium more than 5 times. This indicates instability — check GPU health, /dev/shm orphans, and nginx availability."
