<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>BUT Simple - Template</title>
    <style>
      @font-face {
        font-family: 'Oswald';
        font-weight: 400;
        src: url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1_FvgUE.ttf)
          format('truetype');
      }
      @font-face {
        font-family: 'Oswald';
        font-weight: 500;
        src: url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs18NvgUE.ttf)
          format('truetype');
      }
      @font-face {
        font-family: 'Oswald';
        font-weight: 600;
        src: url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1y9ogUE.ttf)
          format('truetype');
      }
      @font-face {
        font-family: 'Oswald';
        font-weight: 700;
        src: url(https://fonts.gstatic.com/s/oswald/v57/TK3_WkUHHAIjg75cFRf3bXL8LICs1xZogUE.ttf)
          format('truetype');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        font-family: 'Oswald', 'Impact', 'Arial Narrow', sans-serif;
      }

      .container {
        position: relative;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
      }

      /* Video layers - stacked with absolute positioning */
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
      }

      video.layer {
        object-fit: cover;
      }

      /* Layer A - bottom (hexagon background, always opaque) */
      #layer-a {
        z-index: 1;
      }

      /* Layer C - golden background (fades in over A) */
      #layer-c {
        z-index: 3;
      }

      /* Layer B - transition wipe effect (temporary) */
      #layer-b {
        z-index: 4;
      }

      /* Text overlay - above all layers, hidden until transition reveals */
      .text-overlay {
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
      }

      .text-overlay.visible {
        opacity: 1;
      }

      /* Club name top */
      .club-name-top {
        position: absolute;
        top: 215px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 8px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        white-space: nowrap;
      }

      /* Player name - 2 lines */
      .player-name {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      .player-name .prenom,
      .player-name .nom {
        display: block;
        font-size: 130px;
        font-weight: 700;
        line-height: 0.95;
        color: #ffffff;
        text-transform: uppercase;
        font-style: italic;
        text-shadow: 2px 4px 8px rgba(0, 0, 0, 0.3);
      }

      /* Club name bottom */
      .club-name-bottom {
        position: absolute;
        bottom: 195px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 8px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        white-space: nowrap;
      }

      /* Logo overlay - above A (1), below C (3) and B (4) */
      .logo-overlay {
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
      }

      .logo-overlay.animate {
        animation: logoIn 0.6s ease-out forwards;
      }

      .logo-overlay.hidden {
        animation: logoOut 0.4s ease-in forwards;
      }

      @keyframes logoIn {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes logoOut {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(0.8);
        }
      }

      .club-logo {
        width: 500px;
        height: auto;
      }

      /* ── Editor panel (only visible in edit mode) ── */
      .editor-panel {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 20px;
        border-radius: 12px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        width: 320px;
        backdrop-filter: blur(10px);
        display: none;
      }

      body.edit-mode .editor-panel {
        display: block;
      }

      .editor-panel h3 {
        margin-bottom: 16px;
        font-size: 16px;
        font-weight: 600;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        padding-bottom: 8px;
      }

      .editor-panel label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .editor-panel input[type='text'] {
        width: 100%;
        padding: 8px 12px;
        margin-bottom: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: #fff;
        font-size: 14px;
        font-family: inherit;
      }

      .editor-panel input[type='text']:focus {
        outline: none;
        border-color: #ffd700;
      }

      .editor-panel .btn {
        display: inline-block;
        padding: 10px 20px;
        background: #ffd700;
        color: #000;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        margin-top: 8px;
        width: 100%;
        text-align: center;
      }

      .editor-panel .btn:hover {
        background: #ffc000;
      }

      .editor-panel .btn-secondary {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        margin-top: 6px;
      }

      .editor-panel .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.25);
      }
    </style>
  </head>
  <body class="edit-mode">
    <div class="container">
      <!-- Layer C - golden background (bottom) -->
      <video id="layer-c" class="layer" muted preload="auto">
        <source src="BUT_simple_C.webm" type="video/webm" />
      </video>

      <!-- Logo overlay - visible during A phase, fades out with transition -->
      <div class="layer logo-overlay" id="logo-overlay">
        <img src="logo_club.png" alt="Logo club" class="club-logo" />
      </div>

      <!-- Text overlay - editable content (between C and B) -->
      <div class="text-overlay layer" id="text-overlay">
        <span class="club-name-top" id="club-top">NOM DU CLUB</span>
        <div class="player-name">
          <span class="prenom" id="prenom">PRENOM</span>
          <span class="nom" id="nom">NOM</span>
        </div>
        <span class="club-name-bottom" id="club-bottom">NOM DU CLUB</span>
      </div>

      <!-- Layer B - transition wipe (middle, masks text) -->
      <video id="layer-b" class="layer" muted preload="auto">
        <source src="BUT_simple_B.webm" type="video/webm" />
      </video>

      <!-- Layer A - hexagon pattern + logo (top) -->
      <video id="layer-a" class="layer" muted preload="auto">
        <source src="BUT_simple_A.webm" type="video/webm" />
      </video>
    </div>

    <!-- Editor panel -->
    <div class="editor-panel">
      <h3>BUT Simple - Editeur</h3>

      <label for="input-prenom">Prenom</label>
      <input type="text" id="input-prenom" value="PRENOM" placeholder="PRENOM" />

      <label for="input-nom">Nom</label>
      <input type="text" id="input-nom" value="NOM" placeholder="NOM" />

      <label for="input-club">Nom du club</label>
      <input type="text" id="input-club" value="NOM DU CLUB" placeholder="NOM DU CLUB" />

      <button class="btn" onclick="playAll()">Jouer</button>
      <button class="btn btn-secondary" onclick="resetAll()">Reset</button>
      <button class="btn btn-secondary" onclick="toggleEditor()">Masquer editeur</button>
    </div>

    <script>
      // Auto-scale container to fit window
      function scaleToFit() {
        const container = document.querySelector('.container');
        const scaleX = window.innerWidth / 1920;
        const scaleY = window.innerHeight / 1080;
        const scale = Math.min(scaleX, scaleY);
        container.style.transform = `scale(${scale})`;
        // Center if needed
        const offsetX = (window.innerWidth - 1920 * scale) / 2;
        const offsetY = (window.innerHeight - 1080 * scale) / 2;
        container.style.marginLeft = offsetX + 'px';
        container.style.marginTop = offsetY + 'px';
      }
      scaleToFit();
      window.addEventListener('resize', scaleToFit);

      const videoA = document.getElementById('layer-a');
      const videoB = document.getElementById('layer-b');
      const videoC = document.getElementById('layer-c');
      const textOverlay = document.getElementById('text-overlay');
      const logoOverlay = document.getElementById('logo-overlay');

      // Inputs → live update text
      document.getElementById('input-prenom').addEventListener('input', (e) => {
        document.getElementById('prenom').textContent = e.target.value.toUpperCase();
      });

      document.getElementById('input-nom').addEventListener('input', (e) => {
        document.getElementById('nom').textContent = e.target.value.toUpperCase();
      });

      document.getElementById('input-club').addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase();
        document.getElementById('club-top').textContent = val;
        document.getElementById('club-bottom').textContent = val;
      });

      // Force all videos to t=0 on load
      [videoA, videoB, videoC].forEach((v) => {
        v.currentTime = 0;
      });

      // Transition starts ~1.6s, completes ~2.6s
      const LOGO_HIDE_MS = 1600;
      const TEXT_DELAY_MS = 2400;
      let textTimer = null;
      let logoTimer = null;

      function playAll() {
        // Reset
        textOverlay.classList.remove('visible');
        logoOverlay.classList.remove('hidden', 'animate');
        if (textTimer) clearTimeout(textTimer);
        if (logoTimer) clearTimeout(logoTimer);
        videoA.currentTime = 0;
        videoB.currentTime = 0;
        videoC.currentTime = 0;

        // Animate logo in
        logoOverlay.classList.add('animate');

        // Sync and play all 3 videos together
        Promise.all([videoA.play(), videoB.play(), videoC.play()]).catch((err) =>
          console.warn('Play error:', err),
        );

        // Hide logo when transition starts
        logoTimer = setTimeout(() => {
          logoOverlay.classList.add('hidden');
        }, LOGO_HIDE_MS);

        // Reveal text after transition
        textTimer = setTimeout(() => {
          textOverlay.classList.add('visible');
        }, TEXT_DELAY_MS);
      }

      function resetAll() {
        videoA.pause();
        videoB.pause();
        videoC.pause();
        videoA.currentTime = 0;
        videoB.currentTime = 0;
        videoC.currentTime = 0;
        textOverlay.classList.remove('visible');
        logoOverlay.classList.remove('hidden', 'animate');
        logoOverlay.style.opacity = '0';
        if (textTimer) clearTimeout(textTimer);
        if (logoTimer) clearTimeout(logoTimer);
      }

      function toggleEditor() {
        document.body.classList.toggle('edit-mode');
      }

      // Keyboard shortcut: Space = play, R = reset, E = toggle editor
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          playAll();
        }
        if (e.code === 'KeyR') resetAll();
        if (e.code === 'KeyE') toggleEditor();
      });

      // PostMessage API for iframe embedding (dashboard integration)
      window.addEventListener('message', (e) => {
        const data = e.data;
        if (!data || !data.action) return;

        if (data.action === 'play') {
          // Update variables if provided
          if (data.variables) {
            const v = data.variables;
            if (v.prenom) document.getElementById('prenom').textContent = v.prenom.toUpperCase();
            if (v.nom) document.getElementById('nom').textContent = v.nom.toUpperCase();
            if (v.club) {
              document.getElementById('club-top').textContent = v.club.toUpperCase();
              document.getElementById('club-bottom').textContent = v.club.toUpperCase();
            }
            // Update input fields too
            if (v.prenom) document.getElementById('input-prenom').value = v.prenom;
            if (v.nom) document.getElementById('input-nom').value = v.nom;
            if (v.club) document.getElementById('input-club').value = v.club;
          }
          playAll();
        }

        if (data.action === 'reset') {
          resetAll();
        }

        if (data.action === 'update') {
          // Live update variables without playing
          const v = data.variables || {};
          if (v.prenom) {
            document.getElementById('prenom').textContent = v.prenom.toUpperCase();
            document.getElementById('input-prenom').value = v.prenom;
          }
          if (v.nom) {
            document.getElementById('nom').textContent = v.nom.toUpperCase();
            document.getElementById('input-nom').value = v.nom;
          }
          if (v.club) {
            document.getElementById('club-top').textContent = v.club.toUpperCase();
            document.getElementById('club-bottom').textContent = v.club.toUpperCase();
            document.getElementById('input-club').value = v.club;
          }
        }

        if (data.action === 'record') {
          // Update variables
          if (data.variables) {
            const v = data.variables;
            if (v.prenom) document.getElementById('prenom').textContent = v.prenom.toUpperCase();
            if (v.nom) document.getElementById('nom').textContent = v.nom.toUpperCase();
            if (v.club) {
              document.getElementById('club-top').textContent = v.club.toUpperCase();
              document.getElementById('club-bottom').textContent = v.club.toUpperCase();
            }
          }
          recordAnimation();
        }
      });

      // ── Canvas Recording ─────────────────────────────────────────
      function notifyParent(msg) {
        if (window.parent !== window) {
          window.parent.postMessage(msg, '*');
        }
      }

      async function recordAnimation() {
        try {
          notifyParent({ type: 'recordProgress', progress: 1 });

          const W = 1920,
            H = 1080;
          const canvas = document.createElement('canvas');
          canvas.width = W;
          canvas.height = H;
          const ctx = canvas.getContext('2d');

          const logoImg = document.querySelector('.club-logo');
          const logoLoaded = logoImg && logoImg.complete && logoImg.naturalWidth > 0;

          const prenom = document.getElementById('prenom').textContent || 'PRENOM';
          const nom = document.getElementById('nom').textContent || 'NOM';
          const clubTop = document.getElementById('club-top').textContent || 'NOM DU CLUB';
          const clubBottom = document.getElementById('club-bottom').textContent || 'NOM DU CLUB';

          // Load fonts
          try {
            await document.fonts.load('700 130px Oswald');
          } catch {}
          try {
            await document.fonts.load('500 28px Oswald');
          } catch {}

          // Reset videos to start
          videoA.currentTime = 0;
          videoB.currentTime = 0;
          videoC.currentTime = 0;
          await new Promise((r) => setTimeout(r, 200));

          // Pick best available codec
          let mimeType = 'video/webm;codecs=vp8';
          if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
            mimeType = 'video/webm;codecs=vp9';
          }

          const stream = canvas.captureStream(25);
          const chunks = [];
          const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
          recorder.ondataavailable = (e) => {
            if (e.data.size) chunks.push(e.data);
          };

          const recordingDone = new Promise((resolve) => {
            recorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));
          });

          recorder.start(100); // collect data every 100ms
          notifyParent({ type: 'recordProgress', progress: 5 });

          // Play all videos
          await Promise.all([videoA.play(), videoB.play(), videoC.play()]);

          const DURATION = 6;
          const LOGO_HIDE_S = 1.6;
          const TEXT_SHOW_S = 2.4;

          // Render loop — draw frames until videos end
          await new Promise((resolve) => {
            function drawFrame() {
              try {
                const t = videoA.currentTime;
                const pct = Math.min(Math.round((t / DURATION) * 90) + 5, 95);
                notifyParent({ type: 'recordProgress', progress: pct });

                // Layer A (hexagons background)
                ctx.globalAlpha = 1;
                ctx.drawImage(videoA, 0, 0, W, H);

                // Layer C (golden bg)
                ctx.drawImage(videoC, 0, 0, W, H);

                // Layer B (transition wipe)
                ctx.drawImage(videoB, 0, 0, W, H);

                // Logo
                if (t < LOGO_HIDE_S && logoLoaded) {
                  const lw = 500,
                    lh = logoImg.naturalHeight * (500 / logoImg.naturalWidth);
                  const lx = (W - lw) / 2,
                    ly = (H - lh) / 2;
                  let la = 1;
                  if (t < 0.6) la = t / 0.6;
                  else if (t > LOGO_HIDE_S - 0.4) la = (LOGO_HIDE_S - t) / 0.4;
                  ctx.globalAlpha = Math.max(0, Math.min(1, la));
                  ctx.drawImage(logoImg, lx, ly, lw, lh);
                  ctx.globalAlpha = 1;
                }

                // Text
                if (t >= TEXT_SHOW_S) {
                  ctx.globalAlpha = Math.min((t - TEXT_SHOW_S) / 0.3, 1);
                  ctx.textAlign = 'center';

                  ctx.font = '500 28px Oswald, Impact, sans-serif';
                  ctx.fillStyle = 'rgba(255,255,255,0.7)';
                  ctx.fillText(clubTop, W / 2, 245);

                  ctx.font = 'italic 700 130px Oswald, Impact, sans-serif';
                  ctx.fillStyle = '#FFFFFF';
                  ctx.shadowColor = 'rgba(0,0,0,0.3)';
                  ctx.shadowBlur = 8;
                  ctx.fillText(prenom, W / 2, 490);
                  ctx.fillText(nom, W / 2, 620);
                  ctx.shadowColor = 'transparent';
                  ctx.shadowBlur = 0;

                  ctx.font = '500 28px Oswald, Impact, sans-serif';
                  ctx.fillStyle = 'rgba(255,255,255,0.7)';
                  ctx.fillText(clubBottom, W / 2, 890);
                  ctx.globalAlpha = 1;
                }
              } catch (err) {
                console.error('Draw frame error:', err);
              }

              if (!videoA.ended && !videoA.paused) {
                requestAnimationFrame(drawFrame);
              } else {
                recorder.stop();
                resolve();
              }
            }
            requestAnimationFrame(drawFrame);
          });

          const blob = await recordingDone;
          notifyParent({ type: 'recordProgress', progress: 98 });

          // Send as ArrayBuffer (transferable)
          const arrayBuf = await blob.arrayBuffer();
          notifyParent({ type: 'recordProgress', progress: 100 });
          window.parent.postMessage(
            { type: 'recordBlob', buffer: arrayBuf, mimeType: blob.type },
            '*',
            [arrayBuf],
          );
        } catch (err) {
          console.error('recordAnimation error:', err);
          notifyParent({ type: 'recordError', error: err.message || String(err) });
        }
      }

      // If embedded in iframe, hide editor panel
      if (window.parent !== window) {
        document.body.classList.remove('edit-mode');
      }
    </script>
  </body>
</html>
