name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Central Server - Tests & Build
  # ============================================
  central-server:
    name: Central Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: central-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-central-server
          path: central-server/coverage/lcov.info

      - name: Build
        run: npm run build

  # ============================================
  # Central Dashboard - Tests & Build
  # ============================================
  central-dashboard:
    name: Central Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: central-dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Install root dependencies (for angular-eslint)
        run: npm install
        working-directory: .

      - name: Lint
        run: npx ng lint central-dashboard
        working-directory: .

      - name: Run tests
        run: npx ng test --no-watch --browsers=ChromeHeadless --code-coverage
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-central-dashboard
          path: central-dashboard/coverage/neopro-dashboard/lcov.info

      - name: Build production
        run: npm run build:prod

  # ============================================
  # Sync Agent - Tests
  # ============================================
  sync-agent:
    name: Sync Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raspberry/sync-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sync-agent
          path: raspberry/sync-agent/coverage/lcov.info

  # ============================================
  # Webapp Raspberry - Build validation
  # ============================================
  webapp:
    name: Webapp Raspberry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint:raspberry

      - name: Build
        run: npx ng build raspberry --configuration=raspberry

  # ============================================
  # Coverage Report - Upload to Codecov
  # ============================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [central-server, central-dashboard, sync-agent]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: coverage-reports
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
