name: DB Backup (Railway → Hostinger FTP)

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC quotidien
  workflow_dispatch: {}   # permet lancement manuel

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL 18 client + lftp
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18 lftp
          # Ubuntu runners ont postgresql-client-16 preinstalle : prioriser PG18 via PATH
          echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump Railway production
        env:
          RAILWAY_PROD_URL: ${{ secrets.RAILWAY_PROD_URL }}
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TS" >> $GITHUB_ENV
          DUMP_FILE="neopro_$TS.dump"
          echo "DUMP_FILE=$DUMP_FILE" >> $GITHUB_ENV

          pg_dump "$RAILWAY_PROD_URL" \
            --no-owner --no-acl --format=custom \
            -f "$DUMP_FILE"

          ls -lh "$DUMP_FILE"
          echo "DUMP_SIZE=$(stat -c%s $DUMP_FILE)" >> $GITHUB_ENV

      - name: Sanity check dump size
        run: |
          SIZE=${{ env.DUMP_SIZE }}
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Dump suspicious (<1 MB) — aborting to prevent overwriting good backups"
            exit 1
          fi
          echo "Dump size OK: $SIZE bytes"

      - name: Upload to Hostinger FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          # L'utilisateur FTP Hostinger EST chrooté sur `public_html/` — confirmé
          # définitivement par l'erreur 550 sur `rm public_html/` du release deploy
          # (cf. fail run release #1935, fix PR #604). Le `/` du FTP correspond donc
          # déjà au document root web (= `public_html/` côté serveur).
          # Vu côté hPanel file manager : `public_html/neopro-video/db-backups/`.
          # Vu côté FTP user (chrooté) : `/neopro-video/db-backups`.
          # NE PAS préfixer par `/public_html/...` — sinon les dumps atterrissent dans
          # `public_html/public_html/...` (orphelins, invisibles depuis hPanel,
          # bloquent le release deploy mirror — incident PR #604).
          REMOTE_DIR="/neopro-video/db-backups"
          LFTP_SETTINGS="set ssl:verify-certificate no; set ftp:ssl-allow no;"

          # Upload avec vérification d'erreur explicite
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          $LFTP_SETTINGS
          set cmd:fail-exit yes
          # mkdir -f : idempotent, n'échoue pas si le dossier existe déjà
          # (Hostinger FTP renvoie 550 "File exists" sur mkdir -p classique,
          # ce qui combiné à fail-exit:yes interrompait le job — run #16).
          mkdir -f -p $REMOTE_DIR
          cd $REMOTE_DIR
          put $DUMP_FILE
          bye
          EOF

          # Vérification : le fichier doit être présent côté FTP avec la bonne taille.
          # Approche robuste : `du -b` retourne `SIZE PATH` (bytes), pas de parsing
          # de `cls -l` (dont le format varie selon les UIDs numériques Hostinger).
          # `cls --format='%s'` n'est PAS supporté par lftp Ubuntu runner (testé
          # run #14, REMOTE_SIZE=0 retourné silencieusement — saga PRs #597/#599/#602/#606).
          REMOTE_SIZE=$(lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; du -b $DUMP_FILE; bye" 2>/dev/null | awk '{print $1}' | head -1)
          if [ -z "$REMOTE_SIZE" ] || [ "$REMOTE_SIZE" -lt 1000000 ]; then
            echo "::error::Upload FTP échoué ou fichier absent/trop petit côté Hostinger (taille: ${REMOTE_SIZE:-0})"
            echo "::error::DUMP_FILE=$DUMP_FILE — REMOTE_DIR=$REMOTE_DIR — DUMP_SIZE local=$DUMP_SIZE"
            echo "::error::Diagnostic FTP raw du -b output:"
            lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; du -b $DUMP_FILE; cls -l; bye" 2>&1 | sed 's/^/  /'
            exit 1
          fi
          echo "Upload FTP OK: $DUMP_FILE ($REMOTE_SIZE bytes) → $REMOTE_DIR"

          # Diagnostic : log le chemin absolu réel côté FTP (utile en cas de chroot Hostinger)
          # pour distinguer "/public_html/.../db-backups" doc-affiché vs chemin résolu côté serveur.
          echo "=== FTP path resolution diagnostic ==="
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; pwd; cls -l; bye" 2>&1 | sed 's/^/  /'
          echo "=== End diagnostic ==="

          # Purge FTP : on liste puis delete les dumps vieux de >30j
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; cls -l; bye" > /tmp/ftp-ls.txt
          cat /tmp/ftp-ls.txt

          CUTOFF=$(date -d '30 days ago' +%Y%m%d)
          grep -oE 'neopro_[0-9]{8}_[0-9]{6}\.dump' /tmp/ftp-ls.txt | sort -u | while read F; do
            DATE=$(echo "$F" | sed -E 's/neopro_([0-9]{8})_.*/\1/')
            if [ "$DATE" -lt "$CUTOFF" ]; then
              echo "Deleting old backup: $F"
              lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; rm $F; bye" || true
            fi
          done

      # Mirror Supabase retiré (Sprint 0 cleanup delivery system, ADR-070 / ADR-085).
      # Le dump Hostinger FTP (vérifié par sanity check + double upload) est suffisant pour
      # 50 sites — restauration manuelle Railway depuis FTP < 30 min.
      # Garde-fou alternatif possible : test de restauration mensuel depuis FTP.

      - name: Summary
        if: always()
        run: |
          echo "## Backup $TIMESTAMP" >> $GITHUB_STEP_SUMMARY
          echo "- Dump: $DUMP_FILE ($DUMP_SIZE bytes)" >> $GITHUB_STEP_SUMMARY
          echo "- Hostinger FTP: /public_html/neopro-video/db-backups/$DUMP_FILE" >> $GITHUB_STEP_SUMMARY
