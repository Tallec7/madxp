name: DB Backup (Railway → Hostinger FTP + Supabase mirror)

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC quotidien
  workflow_dispatch: {}   # permet lancement manuel

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL 18 client + lftp
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18 lftp
          # Ubuntu runners ont postgresql-client-16 preinstalle : prioriser PG18 via PATH
          echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump Railway production
        env:
          RAILWAY_PROD_URL: ${{ secrets.RAILWAY_PROD_URL }}
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TS" >> $GITHUB_ENV
          DUMP_FILE="neopro_$TS.dump"
          echo "DUMP_FILE=$DUMP_FILE" >> $GITHUB_ENV

          pg_dump "$RAILWAY_PROD_URL" \
            --no-owner --no-acl --format=custom \
            -f "$DUMP_FILE"

          ls -lh "$DUMP_FILE"
          echo "DUMP_SIZE=$(stat -c%s $DUMP_FILE)" >> $GITHUB_ENV

      - name: Sanity check dump size
        run: |
          SIZE=${{ env.DUMP_SIZE }}
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Dump suspicious (<1 MB) — aborting to prevent overwriting good backups"
            exit 1
          fi
          echo "Dump size OK: $SIZE bytes"

      - name: Upload to Hostinger FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          REMOTE_DIR="/public_html/neopro-video/db-backups"
          LFTP_SETTINGS="set ssl:verify-certificate no; set ftp:ssl-allow no;"

          # Upload avec vérification d'erreur explicite
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          $LFTP_SETTINGS
          set cmd:fail-exit yes
          mkdir -p $REMOTE_DIR
          cd $REMOTE_DIR
          put $DUMP_FILE
          bye
          EOF

          # Vérification : le fichier doit être présent côté FTP
          REMOTE_SIZE=$(lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; cls -l $DUMP_FILE; bye" 2>/dev/null | awk '{print $5}' | head -1)
          if [ -z "$REMOTE_SIZE" ] || [ "$REMOTE_SIZE" -lt 1000000 ]; then
            echo "::error::Upload FTP échoué ou fichier absent/trop petit côté Hostinger (taille: ${REMOTE_SIZE:-0})"
            exit 1
          fi
          echo "Upload FTP OK: $DUMP_FILE ($REMOTE_SIZE bytes) → $REMOTE_DIR"

          # Purge FTP : on liste puis delete les dumps vieux de >30j
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; cls -l; bye" > /tmp/ftp-ls.txt
          cat /tmp/ftp-ls.txt

          CUTOFF=$(date -d '30 days ago' +%Y%m%d)
          grep -oE 'neopro_[0-9]{8}_[0-9]{6}\.dump' /tmp/ftp-ls.txt | sort -u | while read F; do
            DATE=$(echo "$F" | sed -E 's/neopro_([0-9]{8})_.*/\1/')
            if [ "$DATE" -lt "$CUTOFF" ]; then
              echo "Deleting old backup: $F"
              lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; rm $F; bye" || true
            fi
          done

      - name: Mirror to Supabase (hot standby)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # Wipe complet : public (tables applicatives) + supabase_migrations (sinon duplicate key)
          psql "$SUPABASE_URL" <<'SQL'
          DROP SCHEMA IF EXISTS public CASCADE;
          DROP SCHEMA IF EXISTS supabase_migrations CASCADE;
          CREATE SCHEMA public;
          GRANT ALL ON SCHEMA public TO postgres, public;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto SCHEMA extensions;
          GRANT USAGE ON SCHEMA extensions TO public;
          SQL

          # Restore — on log tout pour pouvoir diagnostiquer, on garde seulement les erreurs résiduelles
          pg_restore \
            --no-owner --no-acl \
            --no-comments --no-publications --no-subscriptions --no-security-labels \
            -d "$SUPABASE_URL" \
            "$DUMP_FILE" > restore.log 2>&1 || true

          ERRORS=$(grep -c "^pg_restore: error" restore.log || true)
          echo "Restore errors total: $ERRORS"
          echo "=== Dernières erreurs (max 30) ==="
          grep "^pg_restore: error" restore.log | tail -30 || true

          # Garde-fou : si aucune table applicative n'existe côté Supabase, on fail tout de suite
          TABLES=$(psql "$SUPABASE_URL" -At -c "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('sites','users','videos','config_profiles');")
          if [ "$TABLES" -lt 4 ]; then
            echo "::error::Restore incomplet — seulement $TABLES/4 tables critiques présentes côté Supabase"
            exit 1
          fi
          echo "Tables critiques présentes: $TABLES/4"

      - name: Verify checksums Railway vs Supabase
        env:
          RAILWAY_PROD_URL: ${{ secrets.RAILWAY_PROD_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          cat > /tmp/checksums.sql <<'SQL'
          SET search_path = public, extensions;
          SELECT 'sites' AS t, count(*) AS n, md5(string_agg(id::text, ',' ORDER BY id)) AS hash FROM public.sites
          UNION ALL SELECT 'users', count(*), md5(string_agg(id::text, ',' ORDER BY id)) FROM public.users
          UNION ALL SELECT 'videos', count(*), md5(string_agg(id::text, ',' ORDER BY id)) FROM public.videos
          UNION ALL SELECT 'config_profiles', count(*), md5(string_agg(id::text, ',' ORDER BY id)) FROM public.config_profiles
          ORDER BY t;
          SQL

          psql "$RAILWAY_PROD_URL" -At -f /tmp/checksums.sql > /tmp/railway.txt
          psql "$SUPABASE_URL" -At -f /tmp/checksums.sql > /tmp/supabase.txt

          echo "=== Railway ==="; cat /tmp/railway.txt
          echo "=== Supabase ==="; cat /tmp/supabase.txt

          if ! diff -q /tmp/railway.txt /tmp/supabase.txt > /dev/null; then
            echo "::error::Checksums mismatch entre Railway et Supabase"
            diff /tmp/railway.txt /tmp/supabase.txt
            exit 1
          fi
          echo "✅ Checksums match"

      - name: Summary
        if: always()
        run: |
          echo "## Backup $TIMESTAMP" >> $GITHUB_STEP_SUMMARY
          echo "- Dump: $DUMP_FILE ($DUMP_SIZE bytes)" >> $GITHUB_STEP_SUMMARY
          echo "- Hostinger FTP: /public_html/neopro-video/db-backups/$DUMP_FILE" >> $GITHUB_STEP_SUMMARY
          echo "- Supabase mirror: refreshed" >> $GITHUB_STEP_SUMMARY
