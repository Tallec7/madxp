name: DB Backup (Railway → Hostinger FTP + Supabase mirror)

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC quotidien
  workflow_dispatch: {}   # permet lancement manuel

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL 18 client + lftp
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18 lftp
          # Ubuntu runners ont postgresql-client-16 preinstalle : prioriser PG18 via PATH
          echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump Railway production
        env:
          RAILWAY_PROD_URL: ${{ secrets.RAILWAY_PROD_URL }}
        run: |
          TS=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TS" >> $GITHUB_ENV
          DUMP_FILE="neopro_$TS.dump"
          echo "DUMP_FILE=$DUMP_FILE" >> $GITHUB_ENV

          pg_dump "$RAILWAY_PROD_URL" \
            --no-owner --no-acl --format=custom \
            -f "$DUMP_FILE"

          ls -lh "$DUMP_FILE"
          echo "DUMP_SIZE=$(stat -c%s $DUMP_FILE)" >> $GITHUB_ENV

      - name: Sanity check dump size
        run: |
          SIZE=${{ env.DUMP_SIZE }}
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::Dump suspicious (<1 MB) — aborting to prevent overwriting good backups"
            exit 1
          fi
          echo "Dump size OK: $SIZE bytes"

      - name: Upload to Hostinger FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          # L'utilisateur FTP Hostinger est chrooté sur `public_html/` (cf. "Chemin de
          # téléchargement = public_html" dans hPanel). Le `/` du FTP correspond donc
          # déjà à `public_html/` côté serveur — on n'écrit PAS `/public_html/...` ici,
          # sinon les dumps atterrissent dans `public_html/public_html/...` (invisible
          # depuis le file manager hPanel).
          REMOTE_DIR="/neopro-video/db-backups"
          LFTP_SETTINGS="set ssl:verify-certificate no; set ftp:ssl-allow no;"

          # Upload avec vérification d'erreur explicite
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          $LFTP_SETTINGS
          set cmd:fail-exit yes
          mkdir -p $REMOTE_DIR
          cd $REMOTE_DIR
          put $DUMP_FILE
          bye
          EOF

          # Vérification : le fichier doit être présent côté FTP
          # Utilise `cls --format="%s\n"` (size en bytes uniquement) — ne pas parser `cls -l`
          # car le format Hostinger inclut des UIDs numériques qui décalent les colonnes.
          REMOTE_SIZE=$(lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; cls --format='%s\n' $DUMP_FILE; bye" 2>/dev/null | tr -dc '0-9')
          if [ -z "$REMOTE_SIZE" ] || [ "$REMOTE_SIZE" -lt 1000000 ]; then
            echo "::error::Upload FTP échoué ou fichier absent/trop petit côté Hostinger (taille: ${REMOTE_SIZE:-0})"
            exit 1
          fi
          echo "Upload FTP OK: $DUMP_FILE ($REMOTE_SIZE bytes) → $REMOTE_DIR"

          # Diagnostic + garde-fou : log le chemin absolu réel côté FTP, et fail explicitement
          # si le chemin contient `public_html` (= chroot doublé : on a écrit dans
          # `public_html/public_html/...` invisible depuis hPanel — régression du bug ADR-070).
          echo "=== FTP path resolution diagnostic ==="
          PWD_OUTPUT=$(lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; pwd; bye" 2>&1)
          echo "$PWD_OUTPUT" | sed 's/^/  /'
          # Le `pwd` lftp affiche l'URL complète : ftp://user@host/chemin → on extrait le path
          RESOLVED_PATH=$(echo "$PWD_OUTPUT" | grep -oE 'ftp://[^/]+(/.*)?$' | sed -E 's|ftp://[^/]+||' | tail -1)
          if echo "$RESOLVED_PATH" | grep -qi 'public_html'; then
            echo "::error::Chemin FTP résolu contient 'public_html' (\"$RESOLVED_PATH\") — chroot doublé détecté."
            echo "::error::REMOTE_DIR doit être relatif au chroot (ex: /neopro-video/db-backups), pas /public_html/..."
            exit 1
          fi
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; cls -l; bye" 2>&1 | sed 's/^/  /'
          echo "=== End diagnostic ==="

          # Purge FTP : on liste puis delete les dumps vieux de >30j
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; cls -l; bye" > /tmp/ftp-ls.txt
          cat /tmp/ftp-ls.txt

          CUTOFF=$(date -d '30 days ago' +%Y%m%d)
          grep -oE 'neopro_[0-9]{8}_[0-9]{6}\.dump' /tmp/ftp-ls.txt | sort -u | while read F; do
            DATE=$(echo "$F" | sed -E 's/neopro_([0-9]{8})_.*/\1/')
            if [ "$DATE" -lt "$CUTOFF" ]; then
              echo "Deleting old backup: $F"
              lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$LFTP_SETTINGS cd $REMOTE_DIR; rm $F; bye" || true
            fi
          done

      # Mirror Supabase + checksums Railway/Supabase retirés (Sprint 0 cleanup delivery system).
      # Justification : Supabase n'était pas un endpoint applicatif, juste un mirror passif jamais
      # utilisé en cas d'incident. Le dump Hostinger FTP (vérifié par sanity check + double upload)
      # est suffisant pour 50 sites — restauration manuelle Railway depuis FTP < 30 min.
      # Si besoin futur : restaurer manuellement le mirror sur secrets SUPABASE_URL existants,
      # ou prévoir un test de restauration mensuel depuis FTP comme garde-fou alternatif.

      - name: Summary
        if: always()
        run: |
          echo "## Backup $TIMESTAMP" >> $GITHUB_STEP_SUMMARY
          echo "- Dump: $DUMP_FILE ($DUMP_SIZE bytes)" >> $GITHUB_STEP_SUMMARY
          echo "- Hostinger FTP: /public_html/neopro-video/db-backups/$DUMP_FILE" >> $GITHUB_STEP_SUMMARY
