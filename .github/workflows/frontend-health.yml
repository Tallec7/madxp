name: Frontend Health Check

# Synthetic monitoring for neopro-admin.kalonpartners.bzh.
#
# Guards against the class of bugs where a deploy succeeds at the HTTP/200
# root level but silently breaks SPA deep routes — typical symptom: missing
# .htaccess on Hostinger after an FTP clean-slate, producing 404 on
# /saas/remote?site=… or /sites/<uuid> while the home page still works.
#
# Runs every hour. On failure, the workflow fails (which triggers
# GitHub's default email notification to repo watchers) and can be hooked
# into Alertmanager / Discord later via repository_dispatch.
# The workflow_run trigger after Release is the primary detection mechanism;
# the hourly cron is a fallback for non-deploy incidents (Hostinger outage, etc.).

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  # Fire right after every release deploy so a broken deploy is caught
  # within seconds instead of waiting for the next hourly tick.
  workflow_run:
    workflows: ['Release']
    types: [completed]

jobs:
  probe:
    name: Probe SPA deep routes
    runs-on: ubuntu-latest
    # Don't block on release failures — still probe so we detect breakage.
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}

    steps:
      - name: Probe dashboard + SaaS deep routes
        id: probe
        run: |
          BASE='https://neopro-admin.kalonpartners.bzh'
          declare -A ROUTES=(
            ['/']='200'
            ['/sites/ci-probe']='200'
            ['/saas/']='200'
            ['/saas/remote?site=ci-probe']='200'
            ['/saas/tv?site=ci-probe']='200'
          )

          # Retry up to 5 times to absorb:
          # - FTP deploy window (briefly missing .htaccess → 404)
          # - Hostinger/WAF rate limiting (429) — use custom User-Agent and
          #   exponential backoff on 429 to avoid hammering the WAF.
          failures=0
          report=''
          for route in "${!ROUTES[@]}"; do
            expected="${ROUTES[$route]}"
            actual='000'
            for attempt in 1 2 3 4 5; do
              actual=$(curl -sI -o /dev/null -w '%{http_code}' \
                --max-time 10 \
                -A "neopro-ci-verify/1.0" \
                "${BASE}${route}" 2>/dev/null || echo '000')
              if [ "$actual" = "$expected" ]; then
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                if [ "$actual" = "429" ]; then
                  sleep $((5 * (2 ** (attempt - 1))))  # 5s, 10s, 20s, 40s
                else
                  sleep 20
                fi
              fi
            done
            if [ "$actual" != "$expected" ]; then
              failures=$((failures + 1))
              report+=$'\n'"  ❌ ${route} → got ${actual}, expected ${expected} (after 5 attempts)"
            else
              report+=$'\n'"  ✅ ${route} → ${actual}"
            fi
          done

          echo "Probe report:${report}"
          echo "failures=${failures}" >> "$GITHUB_OUTPUT"
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo "${report}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$failures" -gt 0 ]; then
            echo "::error::${failures} SPA route(s) returned unexpected status. Likely cause: missing .htaccess SPA fallback (404) OR Hostinger/WAF rate limiting (429). See docs/guides/TROUBLESHOOTING.md."
            exit 1
          fi

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='[frontend-health] SPA deep routes failing'
          BODY="**Auto-detected**: the scheduled frontend-health probe found broken SPA deep routes.

          Workflow run: ${RUN_URL}

          Likely cause:
          - **404** → missing \`.htaccess\` SPA fallback on Hostinger after an FTP clean-slate deploy
          - **429** → Hostinger/WAF rate limiting (transient — retry usually resolves it)

          Runbook: docs/guides/TROUBLESHOOTING.md → \"SPA 404 sur routes profondes\"."

          EXISTING=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label frontend-health \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$EXISTING" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "frontend-health,bug,prod"
          else
            gh issue comment "$EXISTING" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Probe failed again at $(date -u +%Y-%m-%dT%H:%M:%SZ). Run: ${RUN_URL}"
          fi
