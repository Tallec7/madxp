name: Railway Weekly Restart

# Cron schedule disabled 2026-04-25 — investigation issue #594 (memory leak ?)
# Le redeploy hebdomadaire masquait la cause racine sans la documenter.
# Laissé 14 jours de run sans restart pour observer le profil mémoire via Grafana.
# Si stable → supprimer ce fichier et fermer issue #594.
on:
  # schedule:
  #   - cron: '0 4 * * 0'  # Tous les dimanches à 4h UTC — DISABLED
  workflow_dispatch: # Conservé pour déclenchement manuel d'urgence

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Restart Railway Service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy --yes --service neopro-central
          echo "✅ Railway service restarted successfully"
