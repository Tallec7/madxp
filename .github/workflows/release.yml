name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        run: |
          # Disable workflow commands to prevent commit messages from being interpreted
          echo "::stop-commands::semantic-release-token"
          npx semantic-release
          echo "::semantic-release-token::"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
