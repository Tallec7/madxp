name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Skip chore(release) commits to avoid "local branch is behind remote" loop
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Fetch all tags and sync with remote
        run: |
          git fetch --tags --force
          git pull --ff-only origin main || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic
        run: |
          # Capture semantic-release output to detect if a release was published
          SR_OUTPUT=$(npx semantic-release 2>&1)
          echo "$SR_OUTPUT"

          # Parse the published version from semantic-release output
          PUBLISHED_VERSION=$(echo "$SR_OUTPUT" | grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' | tail -1)

          if [ -n "$PUBLISHED_VERSION" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${PUBLISHED_VERSION}" >> $GITHUB_OUTPUT
            echo "New release published: v${PUBLISHED_VERSION}"
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "No new release published"

            # Detect if release is stuck: eligible commits exist but nothing was published
            SR_STUCK=$(echo "$SR_OUTPUT" | grep -c "local branch.*behind the remote" || true)
            if [ "$SR_STUCK" -gt 0 ]; then
              echo "release_stuck=true" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Alert if release is stuck
        if: steps.semantic.outputs.release_stuck == 'true'
        run: |
          # Check if an alert issue already exists to avoid duplicates
          EXISTING=$(gh issue list --label "release-stuck" --state open --limit 1 --json number -q '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "🚨 Release pipeline stuck — semantic-release cannot publish" \
              --body "$(cat <<'BODY'
          ## Symptôme
          Le workflow release.yml a détecté que semantic-release refuse de publier car la branche locale est en retard sur le remote.

          ## Diagnostic
          ```bash
          gh run list --workflow=release.yml --limit=5
          gh run view <RUN_ID> --log | grep -i "behind the remote"
          ```

          ## Résolution
          Voir [Troubleshooting § Release bloquée](docs/guides/TROUBLESHOOTING.md#release-bloquée)

          _Issue créée automatiquement par le workflow release.yml_
          BODY
          )" \
              --label "release-stuck,bug"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-and-upload:
    name: Build and Upload Release Assets
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set release version
        run: |
          echo "RELEASE_VERSION=v${{ needs.release.outputs.new_release_version }}" >> $GITHUB_ENV
          echo "BUILD_SOURCE=github-actions" >> $GITHUB_ENV

      - name: Build Raspberry package
        run: npm run build:raspberry

      - name: Create webapp-only archive
        run: |
          cd dist/raspberry/browser
          tar -czf ../../../neopro-webapp.tar.gz .

      - name: Prepare release archives
        run: |
          echo "=== Listing generated archives ==="
          ls -la raspberry/*.tar.gz || echo "No archives found"

          # Find the versioned archive (not the symlink, not the legacy)
          VERSIONED_ARCHIVE=$(ls raspberry/neopro-raspberry-v*.tar.gz 2>/dev/null | grep -v legacy | head -1)

          if [ -z "$VERSIONED_ARCHIVE" ]; then
            echo "ERROR: No versioned archive found!"
            exit 1
          fi

          echo "Found versioned archive: $VERSIONED_ARCHIVE"

          # Remove existing symlink and copy the actual file for release
          rm -f raspberry/neopro-raspberry-deploy.tar.gz
          cp "$VERSIONED_ARCHIVE" raspberry/neopro-raspberry-deploy.tar.gz

          echo "=== Final archives for release ==="
          ls -la raspberry/neopro-raspberry-deploy.tar.gz neopro-webapp.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            raspberry/neopro-raspberry-deploy.tar.gz
            neopro-webapp.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dashboard:
    name: Deploy Central Dashboard to Hostinger
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build:central

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: dist/central-dashboard/browser/
          server-dir: /
          dangerous-clean-slate: true
          exclude: |
            saas/**
          timeout: 60000

      - name: Retry deploy on failure
        if: failure()
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: dist/central-dashboard/browser/
          server-dir: /
          dangerous-clean-slate: true
          exclude: |
            saas/**
          timeout: 120000

  deploy-saas:
    name: Deploy SaaS App to Hostinger
    needs: [release, deploy-dashboard]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Inject version into SaaS app
        run: |
          VERSION="v${{ needs.release.outputs.new_release_version }}"
          echo "// Auto-generated at build time by CI pipeline.
          export const APP_VERSION = '${VERSION}';" > raspberry/src/app/version.ts
          echo "Injected version: ${VERSION}"

      - name: Build SaaS app
        run: npm run build:saas

      - name: Prepare SaaS deploy directory
        run: |
          cp raspberry/src/saas-htaccess dist/raspberry/browser/.htaccess

      - name: Create /saas/ directory on Hostinger
        run: |
          curl -s ftp://${{ secrets.HOSTINGER_FTP_SERVER }}/saas/ \
            --user "${{ secrets.HOSTINGER_FTP_USERNAME }}:${{ secrets.HOSTINGER_FTP_PASSWORD }}" \
            --ftp-create-dirs -Q "MKD /saas" 2>/dev/null || true

      - name: Deploy SaaS to Hostinger /saas/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: dist/raspberry/browser/
          server-dir: /saas/
          dangerous-clean-slate: true
          timeout: 60000
