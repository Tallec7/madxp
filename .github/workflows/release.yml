name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Skip chore(release) commits to avoid "local branch is behind remote" loop
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Fetch all tags and sync with remote
        run: |
          git fetch --tags --force
          git pull --ff-only origin main || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic
        run: |
          # Capture output separately so set -e doesn't hide the error message
          set +e
          SR_OUTPUT=$(npx semantic-release 2>&1)
          SR_EXIT=$?
          set -e
          echo "$SR_OUTPUT"

          if [ $SR_EXIT -ne 0 ]; then
            echo "::error::semantic-release exited with code $SR_EXIT"
            exit $SR_EXIT
          fi

          # Parse the published version from semantic-release output
          PUBLISHED_VERSION=$(echo "$SR_OUTPUT" | grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' | tail -1)

          if [ -n "$PUBLISHED_VERSION" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${PUBLISHED_VERSION}" >> $GITHUB_OUTPUT
            echo "New release published: v${PUBLISHED_VERSION}"
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "No new release published"

            # Detect if release is stuck: eligible commits exist but nothing was published
            SR_STUCK=$(echo "$SR_OUTPUT" | grep -c "local branch.*behind the remote" || true)
            if [ "$SR_STUCK" -gt 0 ]; then
              echo "release_stuck=true" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Alert if release is stuck
        if: steps.semantic.outputs.release_stuck == 'true'
        run: |
          # Check if an alert issue already exists to avoid duplicates
          EXISTING=$(gh issue list --label "release-stuck" --state open --limit 1 --json number -q '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "🚨 Release pipeline stuck — semantic-release cannot publish" \
              --body "$(cat <<'BODY'
          ## Symptôme
          Le workflow release.yml a détecté que semantic-release refuse de publier car la branche locale est en retard sur le remote.

          ## Diagnostic
          ```bash
          gh run list --workflow=release.yml --limit=5
          gh run view <RUN_ID> --log | grep -i "behind the remote"
          ```

          ## Résolution
          Voir [Troubleshooting § Release bloquée](docs/guides/TROUBLESHOOTING.md#release-bloquée)

          _Issue créée automatiquement par le workflow release.yml_
          BODY
          )" \
              --label "release-stuck,bug"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-and-upload:
    name: Build and Upload Release Assets
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set release version
        run: |
          echo "RELEASE_VERSION=v${{ needs.release.outputs.new_release_version }}" >> $GITHUB_ENV
          echo "BUILD_SOURCE=github-actions" >> $GITHUB_ENV

      - name: Build Raspberry package
        run: npm run build:raspberry

      - name: Create webapp-only archive
        run: |
          cd dist/raspberry/browser
          tar -czf ../../../neopro-webapp.tar.gz .

      - name: Prepare release archives
        run: |
          echo "=== Listing generated archives ==="
          ls -la raspberry/*.tar.gz || echo "No archives found"

          # Find the versioned archive (not the symlink, not the legacy)
          VERSIONED_ARCHIVE=$(ls raspberry/neopro-raspberry-v*.tar.gz 2>/dev/null | grep -v legacy | head -1)

          if [ -z "$VERSIONED_ARCHIVE" ]; then
            echo "ERROR: No versioned archive found!"
            exit 1
          fi

          echo "Found versioned archive: $VERSIONED_ARCHIVE"

          # Remove existing symlink and copy the actual file for release
          rm -f raspberry/neopro-raspberry-deploy.tar.gz
          cp "$VERSIONED_ARCHIVE" raspberry/neopro-raspberry-deploy.tar.gz

          echo "=== Final archives for release ==="
          ls -la raspberry/neopro-raspberry-deploy.tar.gz neopro-webapp.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: |
            raspberry/neopro-raspberry-deploy.tar.gz
            neopro-webapp.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dashboard:
    name: Deploy Central Dashboard to Hostinger
    needs: release
    # ADR-071 phase 2 : gated. Quand `vars.HOSTING == 'cloudflare'`, ce job est
    # skippé et `deploy-dashboard-cloudflare` prend le relais. Permet la bascule
    # progressive sans patch CI (flip de variable repo/environment GitHub).
    if: needs.release.outputs.new_release_published == 'true' && vars.HOSTING != 'cloudflare'
    runs-on: ubuntu-latest
    # J4 — gate prod deploy via GitHub Environment "production" (required reviewers).
    # Staging dashboard est auto-déployé par Cloudflare Pages, pas concerné par ce job.
    environment: divine-freedom / production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      # The dashboard's runtime deps (react, react-dom, @remotion/player)
      # live in central-dashboard/package.json (ADR-075 Sprint 2). `ng build
      # central-dashboard` resolves modules from the project's node_modules,
      # so both installs are required — matches ci.yml central-dashboard job.
      # `npm install` (not `npm ci`) because central-dashboard/package-lock.json
      # is gitignored (central-dashboard/.gitignore:3).
      - name: Install central-dashboard dependencies
        run: npm install --no-audit --no-fund
        working-directory: central-dashboard

      - name: Build dashboard
        run: npm run build:central

      # lftp mirror replaces SamKirkland/FTP-Deploy-Action.
      # Why: that action repeatedly skipped dotfiles (.htaccess) after
      # `dangerous-clean-slate`, breaking SPA fallback on deep routes
      # (incidents tracked in commits d56de74d, 4ce6fd4b, e765b2f8).
      # lftp `mirror --reverse --delete` is atomic per-file, ships with
      # native retries, and uploads dotfiles like any other file.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy to Hostinger via lftp mirror
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -s dist/central-dashboard/browser/index.html
          test -s dist/central-dashboard/browser/.htaccess
          # Dashboard payload = dotfiles + ~50 fichiers Angular (petit volume).
          # Les optims de PR #625 (parallel=5, sync-mode off, --use-pget-n=4,
          # --only-newer) ont été calibrées pour le SaaS (gros volume) et
          # ralentissaient le dashboard (<1min → ~11min). Revert local au
          # tune pré-#625 — voir comment dans le job SaaS plus bas.
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            set ftp:use-mlsd on;
            set net:max-retries 10;
            set net:reconnect-interval-base 10;
            set net:reconnect-interval-multiplier 1.5;
            set net:timeout 60;
            set mirror:parallel-transfer-count 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_SERVER\";
            mirror --reverse --delete --verbose \
                   --exclude-glob saas/ --exclude-glob saas \
                   --exclude-glob public_html/ --exclude-glob public_html \
                   --exclude-glob neopro-video/ --exclude-glob neopro-video \
                   dist/central-dashboard/browser/ /;
          "
          echo "✅ Dashboard mirrored (dotfiles included, /saas/ preserved)"

      - name: Verify dashboard deployment
        run: |
          echo "Waiting 10s for CDN propagation..."
          sleep 10

          HTTP_STATUS=$(curl -sI -o /dev/null -w "%{http_code}" https://neopro-admin.kalonpartners.bzh/ 2>/dev/null)
          echo "Dashboard root status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "403" ] || [ "$HTTP_STATUS" = "404" ]; then
            echo "::error::Dashboard deploy verification FAILED — GET / returned $HTTP_STATUS (expected 200)"
            echo "This likely means index.html was not uploaded correctly by FTP."
            echo "Check Hostinger File Manager: public_html/neopro-admin/index.html should exist."
            exit 1
          fi

          INDEX_CHECK=$(curl -s https://neopro-admin.kalonpartners.bzh/ 2>/dev/null | grep -c "app-root" || true)
          if [ "$INDEX_CHECK" -eq 0 ]; then
            echo "::error::Dashboard deploy verification FAILED — index.html does not contain <app-root>"
            echo "The served page is not the Angular dashboard. Document root may have changed."
            exit 1
          fi

          # Deep SPA route check — catches missing/broken .htaccess SPA fallback.
          # A bare /sites/<probe> must rewrite to index.html (200), not 404.
          DEEP_STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "https://neopro-admin.kalonpartners.bzh/sites/ci-probe" 2>/dev/null)
          echo "Dashboard deep route /sites/ci-probe status: $DEEP_STATUS"
          if [ "$DEEP_STATUS" != "200" ]; then
            echo "::error::Dashboard SPA fallback BROKEN — /sites/ci-probe returned $DEEP_STATUS (expected 200)."
            echo "Likely cause: .htaccess missing or AllowOverride disabled on Hostinger."
            exit 1
          fi

          echo "✅ Dashboard deployment verified — Angular app + SPA fallback served correctly"

  deploy-saas:
    name: Deploy SaaS App to Hostinger
    needs: [release, deploy-dashboard]
    # ADR-071 phase 2 : gated avec `deploy-dashboard` (cf. commentaire associé).
    if: needs.release.outputs.new_release_published == 'true' && vars.HOSTING != 'cloudflare'
    runs-on: ubuntu-latest
    # J4 — même gate que deploy-dashboard ; production = approbation manuelle.
    environment: divine-freedom / production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Inject version into SaaS app
        run: |
          VERSION="v${{ needs.release.outputs.new_release_version }}"
          echo "// Auto-generated at build time by CI pipeline.
          export const APP_VERSION = '${VERSION}';" > raspberry/src/app/version.ts
          echo "Injected version: ${VERSION}"

      - name: Build SaaS app
        run: npm run build:saas

      - name: Prepare SaaS deploy directory
        run: |
          cp raspberry/src/saas-htaccess dist/raspberry/browser/.htaccess
          if [ ! -s dist/raspberry/browser/.htaccess ]; then
            echo "::error::.htaccess missing or empty in SaaS build — SPA fallback would break"
            exit 1
          fi
          echo "✅ .htaccess staged in SaaS build ($(wc -c < dist/raspberry/browser/.htaccess) bytes)"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy SaaS to Hostinger via lftp mirror
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -s dist/raspberry/browser/index.html
          test -s dist/raspberry/browser/.htaccess
          # `mirror --reverse` auto-creates the remote target dir, so the
          # explicit MKD /saas step is no longer needed.
          # Tune aligné sur deploy-dashboard (pre-#625), depuis #668. Les optims
          # PR #625 (parallel=5, sync-mode off, --use-pget-n=4, --only-newer)
          # avaient été conservées ici en pariant sur "gros volume", mais le run
          # release v3.262.0 (PR #675, SCSS split 6 layouts) a régressé à 11min+
          # — symptôme/magnitude identiques à la régression dashboard reverted #668.
          # Cause : tous les chunks Angular ont un hash frais à chaque release →
          # --only-newer ne sert à rien, et parallel=5 + sync-mode off saturent
          # Hostinger qui throttle silencieusement.
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            set ftp:use-mlsd on;
            set net:max-retries 10;
            set net:reconnect-interval-base 10;
            set net:reconnect-interval-multiplier 1.5;
            set net:timeout 60;
            set mirror:parallel-transfer-count 2;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_SERVER\";
            mirror --reverse --delete --verbose \
                   dist/raspberry/browser/ /saas/;
          "
          echo "✅ SaaS mirrored to /saas/ (dotfiles included)"

      - name: Verify SaaS deployment
        run: |
          echo "Waiting 10s for CDN propagation..."
          sleep 10

          # curl avec retry sur 429 (rate-limit Cloudflare/Hostinger transitoire,
          # incident run release SaaS deploy verify 429 le 2026-04-26).
          # User-Agent custom car certains WAF rate-limitent les UAs vides/curl par défaut.
          probe() {
            local url="$1"
            local attempt
            local code
            for attempt in 1 2 3 4 5; do
              code=$(curl -sI -o /dev/null -w "%{http_code}" \
                -A "neopro-ci-verify/1.0" \
                "$url" 2>/dev/null)
              if [ "$code" != "429" ] && [ "$code" != "000" ]; then
                echo "$code"
                return 0
              fi
              # backoff exponentiel : 5s, 10s, 20s, 40s
              sleep $((5 * (2 ** (attempt - 1))))
            done
            echo "$code"
          }

          HTTP_STATUS=$(probe "https://neopro-admin.kalonpartners.bzh/saas/")
          echo "SaaS /saas/ status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "403" ] || [ "$HTTP_STATUS" = "404" ]; then
            echo "::error::SaaS deploy verification FAILED — GET /saas/ returned $HTTP_STATUS"
            exit 1
          fi

          # Deep SPA route check — /saas/remote?site=<probe> must rewrite to /saas/index.html (200).
          # Without this, missing .htaccess = 404 in prod while CI says ✅.
          REMOTE_STATUS=$(probe "https://neopro-admin.kalonpartners.bzh/saas/remote?site=ci-probe")
          TV_STATUS=$(probe "https://neopro-admin.kalonpartners.bzh/saas/tv?site=ci-probe")
          echo "SaaS deep routes — /saas/remote: $REMOTE_STATUS, /saas/tv: $TV_STATUS"

          if [ "$REMOTE_STATUS" = "429" ] || [ "$TV_STATUS" = "429" ]; then
            echo "::warning::SaaS verify rate-limited après 5 tentatives (429) — skip strict check, deploy considéré OK."
            echo "Si ce warning persiste sur plusieurs runs consécutifs, investiguer Cloudflare/Hostinger WAF."
            exit 0
          fi

          if [ "$REMOTE_STATUS" != "200" ] || [ "$TV_STATUS" != "200" ]; then
            echo "::error::SaaS SPA fallback BROKEN — /saas/remote=$REMOTE_STATUS /saas/tv=$TV_STATUS (expected 200)."
            echo "Likely cause: .htaccess missing in /saas/ after clean-slate FTP deploy."
            exit 1
          fi

          echo "✅ SaaS deployment verified — SPA fallback works on deep routes"

  # ─────────────────────────────────────────────────────────────────────────
  # ADR-071 phase 2 — Cloudflare Pages (prod)
  # ─────────────────────────────────────────────────────────────────────────
  # Activé quand `vars.HOSTING == 'cloudflare'` (variable d'environnement
  # GitHub `production`). Tant que la bascule DNS n'est pas faite, ces jobs
  # restent inactifs — Hostinger continue de servir prod.
  #
  # Pré-requis côté GitHub Environment `production` :
  #   - Variable : HOSTING=cloudflare (flip pour activer)
  #   - Secret   : CLOUDFLARE_API_TOKEN (scope: Pages:Edit)
  #   - Secret   : CLOUDFLARE_ACCOUNT_ID
  #
  # Pré-requis côté Cloudflare :
  #   - Projet Pages `neopro-dashboard-prod`
  #   - Projet Pages `neopro-saas-prod`
  #   - Custom domains attachés (post-migration NS, cf. ADR-071 phase 1)
  # ─────────────────────────────────────────────────────────────────────────

  deploy-dashboard-cloudflare:
    name: Deploy Central Dashboard to Cloudflare Pages
    needs: release
    if: needs.release.outputs.new_release_published == 'true' && vars.HOSTING == 'cloudflare'
    runs-on: ubuntu-latest
    environment: divine-freedom / production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      - name: Install central-dashboard dependencies
        run: npm install --no-audit --no-fund
        working-directory: central-dashboard

      - name: Build dashboard (production)
        run: npm run build:central

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/central-dashboard/browser/index.html
          test -s dist/central-dashboard/browser/_redirects
          test -s dist/central-dashboard/browser/_headers
          echo "✅ Build artefacts présents (index.html + _redirects + _headers)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/central-dashboard/browser --project-name=neopro-dashboard-prod --branch=main

      - name: Verify dashboard deployment
        run: |
          set -euo pipefail
          echo "Waiting 15s for CDN propagation..."
          sleep 15

          probe() {
            local url="$1" attempt code
            for attempt in 1 2 3 4 5; do
              code=$(curl -sI -o /dev/null -w "%{http_code}" \
                -A "neopro-ci-verify/1.0" "$url" 2>/dev/null)
              if [ "$code" != "429" ] && [ "$code" != "000" ]; then
                echo "$code"; return 0
              fi
              sleep $((5 * (2 ** (attempt - 1))))
            done
            echo "$code"
          }

          ROOT_STATUS=$(probe "https://neopro-admin.kalonpartners.bzh/")
          DEEP_STATUS=$(probe "https://neopro-admin.kalonpartners.bzh/sites/ci-probe")
          echo "Dashboard root=$ROOT_STATUS deep=/sites/ci-probe=$DEEP_STATUS"

          if [ "$ROOT_STATUS" != "200" ] || [ "$DEEP_STATUS" != "200" ]; then
            echo "::error::Dashboard Cloudflare Pages deploy failed (root=$ROOT_STATUS deep=$DEEP_STATUS)"
            exit 1
          fi
          echo "✅ Dashboard Cloudflare Pages — racine + SPA fallback OK"

  deploy-saas-cloudflare:
    name: Deploy SaaS App to Cloudflare Pages
    needs: [release, deploy-dashboard-cloudflare]
    if: needs.release.outputs.new_release_published == 'true' && vars.HOSTING == 'cloudflare'
    runs-on: ubuntu-latest
    environment: divine-freedom / production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Inject version into SaaS app
        run: |
          VERSION="v${{ needs.release.outputs.new_release_version }}"
          echo "// Auto-generated at build time by CI pipeline.
          export const APP_VERSION = '${VERSION}';" > raspberry/src/app/version.ts
          echo "Injected version: ${VERSION}"

      - name: Build SaaS app (saas configuration)
        run: npm run build:saas

      - name: Verify SaaS build output
        run: |
          set -euo pipefail
          test -s dist/raspberry/browser/index.html
          test -s dist/raspberry/browser/_redirects
          test -s dist/raspberry/browser/_headers
          echo "✅ SaaS build artefacts présents (index.html + _redirects + _headers)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/raspberry/browser --project-name=neopro-saas-prod --branch=main

      - name: Verify SaaS deployment
        run: |
          set -euo pipefail
          echo "Waiting 15s for CDN propagation..."
          sleep 15

          probe() {
            local url="$1" attempt code
            for attempt in 1 2 3 4 5; do
              code=$(curl -sI -o /dev/null -w "%{http_code}" \
                -A "neopro-ci-verify/1.0" "$url" 2>/dev/null)
              if [ "$code" != "429" ] && [ "$code" != "000" ]; then
                echo "$code"; return 0
              fi
              sleep $((5 * (2 ** (attempt - 1))))
            done
            echo "$code"
          }

          # NB : URL custom domain SaaS à confirmer post-bascule (ADR-071 phase 1).
          # Par défaut on probe l'URL `*.pages.dev` du projet — override via
          # `vars.SAAS_PUBLIC_BASE_URL` quand le custom domain est attaché.
          BASE="${{ vars.SAAS_PUBLIC_BASE_URL || 'https://neopro-saas-prod.pages.dev' }}"
          ROOT_STATUS=$(probe "$BASE/")
          REMOTE_STATUS=$(probe "$BASE/remote?site=ci-probe")
          TV_STATUS=$(probe "$BASE/tv?site=ci-probe")
          echo "SaaS base=$BASE root=$ROOT_STATUS remote=$REMOTE_STATUS tv=$TV_STATUS"

          if [ "$ROOT_STATUS" != "200" ] || [ "$REMOTE_STATUS" != "200" ] || [ "$TV_STATUS" != "200" ]; then
            echo "::error::SaaS Cloudflare Pages deploy failed (root=$ROOT_STATUS remote=$REMOTE_STATUS tv=$TV_STATUS)"
            exit 1
          fi
          echo "✅ SaaS Cloudflare Pages — racine + SPA fallback (deep routes) OK"

  deploy-railway:
    name: Deploy Central Server to Railway
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    # J4 — même gate que dashboard/saas : approbation manuelle via GitHub Environment.
    # Auto-deploy Railway est désactivé (watchPatterns = __manual_deploy_only__/**).
    # Ce job bump __manual_deploy_only__/trigger.md → Railway rebuild via watch.
    environment: divine-freedom / production
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: main

      - name: Bump Railway deploy trigger
        run: |
          mkdir -p __manual_deploy_only__
          TRIGGER_FILE="__manual_deploy_only__/trigger.md"
          VERSION="${{ needs.release.outputs.new_release_version }}"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="${GITHUB_SHA:0:8}"

          # Append one line to the history table to force a real file change
          # (empty commits don't match railway.json watchPatterns).
          if [ ! -f "$TRIGGER_FILE" ]; then
            cat > "$TRIGGER_FILE" <<EOF
          # Manual Deploy Trigger

          Ce dossier matche \`watchPatterns\` de \`railway.json\` — commit ici = rebuild prod Railway.

          ## Historique

          | Date | Commit SHA | Version |
          |------|------------|---------|
          EOF
          fi
          echo "| $TS | $SHA | $VERSION |" >> "$TRIGGER_FILE"

      - name: Commit + push trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __manual_deploy_only__/trigger.md
          git commit -m "chore(deploy): trigger Railway rebuild for v${{ needs.release.outputs.new_release_version }} [skip ci]"
          git push origin main

      - name: Verify Railway deploy actually restarted (catch silent build failures)
        # Sprint 2 supervision (post-incident v3.240.x BuildKit bug PR #595) :
        # si le build Railway échoue (parse error Dockerfile, OOM, etc.), Railway
        # garde l'ancienne version qui répond toujours 200 sur /live. La détection
        # par HTTP seul est aveugle. On utilise donc l'uptime exposé par /health
        # comme signal de redémarrage : après ~6 min, si l'API n'a PAS redémarré
        # (uptime > 600s), le build a silencieusement échoué.
        run: |
          echo "⏳ Waiting 90s for Railway to detect the watchPattern match..."
          sleep 90
          echo "⏳ Waiting 5 more minutes for Docker build + start..."
          sleep 300

          API="https://neopro-central-production.up.railway.app"
          MAX_RETRIES=10
          RETRY_DELAY=30

          for i in $(seq 1 $MAX_RETRIES); do
            HEALTH=$(curl -sf --max-time 10 "$API/health" || echo "")
            if [ -n "$HEALTH" ]; then
              UPTIME=$(echo "$HEALTH" | jq -r '.uptime // 99999')
              UPTIME_INT=${UPTIME%.*}
              echo "Probe $i/$MAX_RETRIES — API uptime: ${UPTIME_INT}s"

              # Si uptime < 600s (10 min), API a redémarré → build OK.
              if [ "$UPTIME_INT" -lt 600 ]; then
                echo "✅ Railway deploy succeeded — API uptime ${UPTIME_INT}s < 600s"
                exit 0
              fi
            else
              echo "Probe $i/$MAX_RETRIES — /health unreachable"
            fi
            sleep $RETRY_DELAY
          done

          # Échec : l'API n'a jamais redémarré dans la fenêtre attendue.
          echo "::error::Railway deploy verification FAILED — API did not restart within $((90 + 300 + MAX_RETRIES * RETRY_DELAY))s"
          echo "::error::Likely cause : Docker build failed silently. Check Railway dashboard."
          echo ""
          echo "Action immédiate :"
          echo "  1. Railway dashboard → service neopro-central → onglet Deployments"
          echo "  2. Identifier le build FAILED le plus récent → View logs"
          echo "  3. Si parse error Dockerfile, voir docs/guides/RUNBOOK_INCIDENT.md §7"

          # Crée une issue auto pour alerter l'équipe (idempotent — pas de doublon).
          EXISTING=$(gh issue list --label "release-stuck" --state open --limit 1 --json number -q '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "🚨 Railway build failed silently — v${{ needs.release.outputs.new_release_version }}" \
              --label "release-stuck,infra,urgent-nlf" \
              --body "$(cat <<'BODY'
          ## Symptôme

          Le job \`deploy-railway\` du workflow \`release.yml\` a tagué une nouvelle version
          mais l'API Railway prod n'a PAS redémarré dans les 8-9 minutes suivantes
          (uptime > 600s détecté).

          ## Cause probable

          Le build Docker a échoué silencieusement. Railway garde l'ancienne version
          qui répond toujours 200, donc invisible côté \`/live\` HTTP.

          ## Action immédiate

          1. Railway dashboard → service \`neopro-central\` → onglet Deployments
          2. Le dernier build doit être en état \`FAILED\` — ouvrir les logs
          3. Si parse error Dockerfile (ex: BuildKit) → voir PR #595 pour pattern fix
          4. Si OOM → voir \`railway-restart.yml\` workaround memory leak issue #594

          ## Contexte release

          - Version : v${VERSION}
          - SHA : ${SHA}
          - Workflow : ${WORKFLOW_URL}

          _Issue créée automatiquement par \`release.yml\` (Sprint 2 supervision)._
          BODY
          )" || echo "::warning::Could not create issue (gh permissions?)"
          fi

          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
          SHA: ${{ github.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
