<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test - Page de Login Admin avec Infos Club</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: linear-gradient(135deg, #2022e9 0%, #3a0686 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .login-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        padding: 48px 40px;
      }
      .logo {
        text-align: center;
        margin-bottom: 32px;
      }
      .logo h1 {
        font-size: 28px;
        color: #2022e9;
      }
      .logo p {
        color: #6b7280;
        font-size: 14px;
        margin-top: 8px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
        font-size: 14px;
      }
      input[type='password'] {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.2s;
      }
      input[type='password']:focus {
        outline: none;
        border-color: #2022e9;
        box-shadow: 0 0 0 3px rgba(32, 34, 233, 0.1);
      }
      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #2022e9 0%, #3a0686 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(32, 34, 233, 0.4);
      }
      .club-info {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #e5e7eb;
        text-align: center;
      }
      .club-info-text {
        font-size: 11px;
        color: #9ca3af;
        line-height: 1.6;
      }
      .club-info-text span {
        display: inline;
        white-space: nowrap;
      }
      .club-info-text .separator {
        margin: 0 6px;
        color: #d1d5db;
      }
      @media (max-width: 480px) {
        .club-info-text {
          font-size: 10px;
          line-height: 1.5;
        }
        .club-info-text .separator {
          margin: 0 4px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="logo">
        <h1>NeoPro Admin</h1>
        <p>Panneau d'administration</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Entrez le mot de passe"
            required
          />
        </div>
        <button type="submit">Se connecter</button>
      </form>

      <!-- Exemple avec toutes les infos -->
      <div class="club-info">
        <div class="club-info-text">
          <span>RACC Handball Nantes</span>
          <span class="separator">•</span>
          <span>Gymnase de la Bottière</span>
          <span class="separator">•</span>
          <span>Handball</span>
          <span class="separator">•</span>
          <span>Nantes, Pays De La Loire, France</span>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Ceci est une page de démo - pas de vraie connexion');
      });
    </script>
  </body>
</html>
