<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <title>Neopro</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="neopro-logo-white.png" />
    <!-- E-23 US-23.7.3: PWA manifest for standalone mode (bypasses autoplay restriction) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Socket.IO client local (pas de CDN pour fonctionner hors-ligne) -->
    <script src="assets/socket.io.min.js"></script>
  </head>
  <body>
    <!-- Splash boot inline — s'affiche instantanément avant le bootstrap Angular.
         Utilise le vrai logo NEOPRO (neopro-logo-white.png) + spinner CSS.
         Supprimé par app.component.ts dès qu'Angular est prêt. -->
    <div
      id="neopro-boot-splash"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      "
    >
      <img
        src="neopro-logo-white.png"
        alt="NEOPRO"
        style="width: min(40%, 500px); height: auto; opacity: 0.92"
      />
      <div
        style="
          width: 48px;
          height: 48px;
          border: 3px solid rgba(255, 255, 255, 0.1);
          border-top-color: rgba(255, 255, 255, 0.8);
          border-radius: 50%;
          animation: neo-spin 1s linear infinite;
        "
      ></div>
      <p style="font-size: 1.2rem; color: rgba(255, 255, 255, 0.6); margin: 0">Chargement...</p>
    </div>
    <style>
      @keyframes neo-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <app-root></app-root>
    <!-- E-23 US-23.7.3: Register service worker + audio unlock on first interaction -->
    <script>
      if ('serviceWorker' in navigator) {
        // Use relative URL so it works under both "/" (Pi) and "/saas/" (SaaS) baseHref
        var swUrl = new URL('service-worker.js', document.baseURI).href;
        navigator.serviceWorker
          .register(swUrl)
          .then(function () {
            // Listen for audio-unlocked broadcast from SW
            navigator.serviceWorker.addEventListener('message', function (e) {
              if (e.data && e.data.type === 'audio-unlocked' && window.__neoproAudioCtx) {
                window.__neoproAudioCtx.resume();
              }
            });
          })
          .catch(function () {});
        // On first user gesture, create AudioContext and ask SW to broadcast unlock
        document.addEventListener(
          'click',
          function neoFirstClick() {
            document.removeEventListener('click', neoFirstClick);
            window.__neoproAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage({ type: 'audio-unlock-request' });
            }
          },
          { once: true },
        );
      }
    </script>
  </body>
</html>
