<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <title>Neopro</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- E-23 US-23.7.3: PWA manifest for standalone mode (bypasses autoplay restriction) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Socket.IO client local (pas de CDN pour fonctionner hors-ligne) -->
    <script src="assets/socket.io.min.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <!-- E-23 US-23.7.3: Register service worker + audio unlock on first interaction -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('/service-worker.js')
          .then(function () {
            // Listen for audio-unlocked broadcast from SW
            navigator.serviceWorker.addEventListener('message', function (e) {
              if (e.data && e.data.type === 'audio-unlocked' && window.__neoproAudioCtx) {
                window.__neoproAudioCtx.resume();
              }
            });
          })
          .catch(function () {});
        // On first user gesture, create AudioContext and ask SW to broadcast unlock
        document.addEventListener(
          'click',
          function neoFirstClick() {
            document.removeEventListener('click', neoFirstClick);
            window.__neoproAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage({ type: 'audio-unlock-request' });
            }
          },
          { once: true },
        );
      }
    </script>
  </body>
</html>
