<!-- Écran de blocage licence (z-index 9999, au-dessus de tout) -->
<app-license-block
  *ngIf="isLicenseBlocked && licenseState"
  [licenseState]="licenseState"
  [siteReference]="
    (configuration?.sync?.clubName || configuration?.sync?.siteName || 'N/A') +
    (configuration?.sync?.clubName && configuration?.sync?.siteName
      ? ' (' + configuration.sync.siteName + ')'
      : '')
  "
></app-license-block>

<!-- E-23 US-23.5.3: Wrong HDMI port detected — help screen with countdown (z-index 50) -->
<app-wrong-port-screen *ngIf="wrongPort && !isLicenseBlocked"></app-wrong-port-screen>

<!-- E-23 US-23.2.1: Splash screen quand aucun écran connecté (z-index 50) -->
<app-waiting-screen
  *ngIf="!hdmiConnected && !wrongPort && !isLicenseBlocked"
  [message]="
    displayType === 'secondary'
      ? 'En attente de l\u2019\u00e9cran secondaire\u2026'
      : 'En attente d\u2019\u00e9cran\u2026'
  "
  [subMessage]="'Branchez un \u00e9cran sur le port HDMI'"
></app-waiting-screen>

<!-- E-23 US-23.3.2: Demotion notice when Pi takes over as master (z-index 40) -->
<div *ngIf="demotionNotice" class="demotion-notice">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="12" r="10" />
    <line x1="12" y1="8" x2="12" y2="12" />
    <line x1="12" y1="16" x2="12.01" y2="16" />
  </svg>
  <span>Le boîtier Pi est connecté — cette fenêtre passe en mode secondaire</span>
</div>

<!-- Canvas freeze-frame pour transitions sans flash (z-index 20) -->
<canvas #freezeCanvas class="freeze-canvas" [hidden]="isLicenseBlocked"></canvas>

<!-- Overlay noir pour bloquer la boucle pendant les transitions (z-index 5) -->
<div #blackOverlay class="black-overlay" [hidden]="isLicenseBlocked"></div>

<!-- Double-buffer vidéo pour la BOUCLE (z-index 1-2) -->
<video
  #playerA
  class="double-buffer-player player-a"
  playsinline
  muted
  [hidden]="isLicenseBlocked"
></video>
<video
  #playerB
  class="double-buffer-player player-b"
  playsinline
  muted
  [hidden]="isLicenseBlocked"
></video>

<!-- Player vidéo MANUEL (z-index 10, au-dessus de la boucle et de l'overlay noir) -->
<video
  #manualPlayerA
  class="manual-player manual-player-a"
  playsinline
  muted
  [hidden]="isLicenseBlocked"
></video>
<video
  #manualPlayerB
  class="manual-player manual-player-b"
  playsinline
  muted
  [hidden]="isLicenseBlocked"
></video>

<!-- Score Overlay Component (score, timer, goal animation, breaking news, secondary overlays) -->
<app-score-overlay
  [configuration]="configuration"
  [displayType]="displayType"
  [displayIndex]="displayIndex"
></app-score-overlay>

<!-- Watermark Overlay (z-index 1100, au-dessus du score mais sous les animations) -->
<div
  class="watermark-overlay"
  *ngIf="showWatermark && configuration?.watermark?.enabled && configuration?.watermark?.imagePath"
  [ngStyle]="getWatermarkStyles()"
  [ngClass]="getWatermarkAnimationClass()"
>
  <img
    [src]="getWatermarkImageSrc()"
    alt="Watermark"
    class="watermark-image"
    (error)="onWatermarkError()"
  />
</div>
