<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MadXP — En attente</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 4vh 4vw;
        text-align: center;
      }
      /* Toutes les tailles sont en unités viewport (vw/vh) — Silk Browser sur
         Fire Stick rapporte un viewport variable selon le modèle TV (parfois
         1280×720, parfois 1366×768) et l'overscan crop ~5% les bords. Avec
         viewport meta = device-width, vw/vh suivent le viewport réel et tout
         s'adapte. UI-SPEC target : MAC = 128px @ 1920×1080 (≈ 11.85vh). */
      h1 {
        font-size: min(4.4vw, 7.5vh);
        font-weight: 700;
        line-height: 1.2;
        margin: 0 0 2.2vh 0;
      }
      .subhead {
        font-size: min(2.2vw, 3.7vh);
        font-weight: 400;
        line-height: 1.4;
        opacity: 0.7;
        margin: 0 0 2.2vh 0;
      }
      .mac {
        /* Target UI-SPEC : 128px @ 1920×1080 (≈ 6.7vw / 11.8vh) — viewport-relatif
           pour scaler aux résolutions Silk réelles sans déborder. */
        font-size: min(6.5vw, 11vh);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.4vw;
        margin: 0 0 3vh 0;
        text-transform: uppercase;
        max-width: 100%;
        white-space: nowrap;
      }
      .spin {
        width: 7vh;
        height: 7vh;
        border: 1.4vh solid #333333;
        border-top-color: #2022e9;
        border-radius: 50%;
        animation: spin 2s linear infinite;
        margin: 0 0 3vh 0;
      }
      .footer {
        font-size: min(2.2vw, 3.5vh);
        font-weight: 400;
        line-height: 1.4;
        margin: 0;
        max-width: 90vw;
      }
      .error {
        display: none;
      }
      body.error-state .normal {
        display: none;
      }
      body.error-state .error {
        display: block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="normal">
      <h1>En attente d'assignation</h1>
      <p class="subhead">Code de cet écran</p>
      <div class="mac" id="mac" data-mac="">--:--:--:--:--:--</div>
      <div class="spin" aria-hidden="true"></div>
      <p class="footer">
        Communiquez ce code à votre administrateur. La page basculera automatiquement.
      </p>
    </div>
    <div class="error">
      <h1>Code écran indisponible</h1>
      <p class="footer">Redémarrez le Fire Stick et reconnectez-vous au réseau du club.</p>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var myMac = (params.get('mac') || '').toLowerCase();

        if (!myMac) {
          document.body.classList.add('error-state');
          return;
        }

        var macEl = document.getElementById('mac');
        macEl.textContent = myMac.toUpperCase();
        macEl.setAttribute('data-mac', myMac);

        function gotoDisplay(displayIndex) {
          window.location.replace('/?display=' + displayIndex);
        }

        // Primary: Socket.IO push (latence < 200ms)
        try {
          var socket = io({ transports: ['websocket', 'polling'] });
          socket.on('connected-receivers-changed', function (payload) {
            if (!payload || !Array.isArray(payload.receivers)) return;
            var me = payload.receivers.find(function (r) {
              return r && typeof r.mac === 'string' && r.mac.toLowerCase() === myMac;
            });
            if (me && me.displayIndex !== null && me.displayIndex !== undefined) {
              gotoDisplay(me.displayIndex);
            }
          });
        } catch (e) {
          /* socket.io non chargé — polling prend le relais */
        }

        // Safety net: polling 5s
        setInterval(function () {
          fetch('/api/captive/whoami', { cache: 'no-store' })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (d) {
              if (d && d.displayIndex !== null && d.displayIndex !== undefined) {
                gotoDisplay(d.displayIndex);
              }
            })
            .catch(function () {
              /* offline transitoire */
            });
        }, 5000);
      })();
    </script>
  </body>
</html>
