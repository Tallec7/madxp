# Configuration du serveur DHCP pour le Hotspot Neopro
# dnsmasq gère l'attribution automatique des adresses IP aux clients WiFi

# Interface réseau à écouter
interface=wlan0

# Ne pas écouter sur d'autres interfaces
bind-interfaces

# Plage d'adresses IP à distribuer
# Format: dhcp-range=IP_DEBUT,IP_FIN,MASQUE,DUREE_BAIL
# IP du Raspberry: 192.168.4.1
# Plage clients: 192.168.4.10 à 192.168.4.200 (190 clients max) — ADR-072
# Bail 2h (au lieu de 24h) pour éviter la saturation du pool par les MACs randomisées iOS/Android
dhcp-range=192.168.4.10,192.168.4.200,255.255.255.0,2h

# Mode "authoritative" : on est le seul DHCP du segment, on peut renouveler
# des baux existants sans rebind complet (réduit les réassocs)
dhcp-authoritative

# Serveur DNS upstream (utilisé uniquement pour les domaines NON couverts
# par le wildcard hijack ci-dessous — concrètement plus aucun, mais on les
# laisse pour ne pas changer le comportement si le wildcard est retiré).
server=8.8.8.8
server=8.8.4.4

# Domaine local
domain=neopro.local

# Adresse du serveur DHCP (le Raspberry Pi)
dhcp-option=3,192.168.4.1

# Adresse du serveur DNS (le Raspberry Pi)
dhcp-option=6,192.168.4.1

# Résolution locale neopro.local → 192.168.4.1
address=/neopro.local/192.168.4.1

# ========================================================================
# CAPTIVE PORTAL - Redirection des checks de connectivité vers le Pi
# ========================================================================

# Android (Google) — uniquement les endpoints de détection captive portal
# NE PAS rediriger play.googleapis.com ni clients3.google.com : Android fait
# de vraies requêtes API là-dessus, les rediriger casse la détection internet.
address=/connectivitycheck.gstatic.com/192.168.4.1
address=/connectivitycheck.google.com/192.168.4.1

# Windows
address=/www.msftconnecttest.com/192.168.4.1
address=/www.msftncsi.com/192.168.4.1

# Apple iOS — uniquement captive.apple.com (nginx répond /hotspot-detect.html)
# NE PAS rediriger www.apple.com : iOS l'utilise pour push, sync, APIs diverses.
# Le rediriger marque le réseau comme "captive bloqué" → les appareils coupent le routage.
address=/captive.apple.com/192.168.4.1

# Fire OS / Fire Stick captive probes (Phase 6 - CAPTIVE-01)
address=/firetvcaptiveportal.com/192.168.4.1
address=/spectrum.s3.amazonaws.com/192.168.4.1

# ========================================================================
# WILDCARD HIJACK — simulate internet for offline Pi (Phase 14)
# ========================================================================
# Sans uplink (Pi club sans Ethernet ni clé WiFi USB), les requêtes DNS
# non hijackées tombent sur server=8.8.8.8 → timeout → Fire OS / Android
# concluent "no internet" et bloquent la connexion WiFi à l'étape setup.
#
# Le wildcard `/#/` répond 192.168.4.1 pour TOUT domaine non listé plus haut.
# Effet : aucun timeout DNS, Fire OS valide la connexion, et toute URL
# que le device essaie de joindre tombe sur le nginx local (catch-all 302
# → page Neopro). Combiné avec `firestick-captive.conf` qui répond 204 sur
# /generate_204, Fire OS accepte le réseau sans warning.
#
# Précaution : ne PAS ajouter ce wildcard avant les `address=/...` explicites
# ci-dessus — dnsmasq applique le matching le plus spécifique d'abord.
address=/#/192.168.4.1

# Cache DNS
cache-size=1000

# Log des requêtes DHCP (utile pour debug)
log-dhcp

# Fichier de log
log-facility=/var/log/dnsmasq.log
