# Configuration du Hotspot WiFi pour Neopro
# Ce fichier configure le Raspberry Pi comme point d'accès WiFi

# Interface WiFi utilisée (généralement wlan0)
interface=wlan0

# Driver WiFi
driver=nl80211

# SSID du réseau (nom visible par les clients)
# Format: NEOPRO-[NOM_CLUB]
# Exemple: NEOPRO-CESSON ou NEOPRO-DEMO
ssid=NEOPRO-CLUB

# Mode: g = 2.4GHz (meilleure compatibilité)
hw_mode=g

# Canal WiFi (1-11 en Europe)
# Recommandé: 6 (bon compromis)
channel=6

# WMM (WiFi Multimedia) - Améliore les performances
wmm_enabled=1

# Sécurité: WPA2
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Mot de passe WiFi (8-63 caractères)
# ADR-073 S1 — placeholder INUTILISABLE ; install.sh génère un PSK unique par club
# via openssl rand ou prend celui passé en arg2. Si ce placeholder apparaît en prod,
# c'est qu'install.sh n'a pas fini d'exécuter — hostapd refusera de démarrer.
wpa_passphrase=NEOPRO_PLACEHOLDER_RUN_INSTALL_SH

# Nombre maximum de clients simultanés
# ADR-072 : passé de 10 à 50 (10 causait des rejets silencieux dès le 11e client)
max_num_sta=50

# Masquer le SSID (0=visible, 1=caché)
# Recommandé: 0 pour faciliter la connexion
ignore_broadcast_ssid=0

# IEEE 802.11n (améliore le débit)
ieee80211n=1

# Capacités HT (HT20, short guard interval) — ADR-072
# Requis pour l'association iOS/Android récents en mode strict
ht_capab=[HT20][SHORT-GI-20][DSSS_CCK-40]

# Configuration pays (réglementations radio)
country_code=FR

# Element "pays" dans les beacons 802.11d — ADR-072
# Sans ça, iOS/Android récents peuvent refuser l'association (conformité régulatoire)
ieee80211d=1

# Protected Management Frames (802.11w) — ADR-072 OTA-2
# Mode "optional" (1) : les clients iOS 16+/Android récents négocient PMF ;
# les devices anciens restent compatibles (ne bascule PAS en "required" = 2
# qui casserait les clients pré-2018).
ieee80211w=1

# Client isolation — ADR-073 S3
# Empêche les clients WiFi de se voir entre eux (ARP spoof / MitM bloqué).
# Le staff accède seulement au Pi (192.168.4.1), pas aux autres téléphones.
ap_isolate=1
