# Configuration nginx pour Captive Portal (Android, iOS, Windows)
# À ajouter dans la config nginx principale pour répondre aux checks de connectivité

server {
    listen 80 default_server;
    server_name _;

    # ====================================================================
    # CAPTIVE PORTAL - Endpoints de détection de connectivité
    # Chaque OS vérifie la connectivité Internet via des URLs spécifiques.
    # Sans réponse correcte, l'appareil restreint l'accès réseau.
    # ====================================================================

    # Android (Google)
    location /generate_204 {
        return 204;
    }

    # Android (ancienne version)
    location /gen_204 {
        return 204;
    }

    # Apple iOS / macOS — endpoint principal
    # iOS envoie GET http://captive.apple.com/hotspot-detect.html
    # Réponse attendue : HTTP 200 avec body "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>"
    # Si la réponse est différente, iOS ouvre un captive portal sheet
    # et RESTREINT l'accès réseau dans Safari → "impossible de se connecter"
    location /hotspot-detect.html {
        default_type text/html;
        return 200 "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>";
    }

    # Apple iOS — endpoint alternatif (certaines versions iOS)
    location /library/test/success.html {
        default_type text/html;
        return 200 "Success";
    }

    # Chrome Captive Portal detection
    location /connecttest.txt {
        return 200 "Microsoft Connect Test";
        add_header Content-Type text/plain;
    }

    # Windows Captive Portal
    location /ncsi.txt {
        return 200 "Microsoft NCSI";
        add_header Content-Type text/plain;
    }

    # Redirection alternative : envoyer vers la page de login
    # Si on veut forcer l'ouverture du navigateur Android
    # location /generate_204 {
    #     return 302 http://192.168.4.1/login;
    # }

    # index.html — jamais mis en cache (garantit le chargement du dernier build Angular)
    location = /index.html {
        root /home/pi/neopro/webapp;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Profils multi-config — jamais caches (mis a jour par sync_profiles)
    location /profiles/ {
        root /home/pi/neopro/webapp;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Configuration active — jamais cachee (= exact match gagne sur la regex)
    location = /configuration.json {
        root /home/pi/neopro/webapp;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Fichiers statiques : retourner 404 si manquant (pas de fallback HTML)
    location ~* \.(js|mjs|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|json|map)$ {
        root /home/pi/neopro/webapp;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Routes normales de l'application (fallback SPA uniquement pour les routes)
    location / {
        root /home/pi/neopro/webapp;
        try_files $uri $uri/ /index.html;
    }

    # Fichiers vidéos (proxy vers admin-server pour normalisation Unicode)
    location /videos/ {
        proxy_pass http://127.0.0.1:8080/videos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Thumbnails (proxy vers admin-server pour normalisation Unicode)
    location /thumbnails/ {
        proxy_pass http://127.0.0.1:8080/thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Socket.IO (serveur TV Angular ↔ télécommande)
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Proxy Admin interface (port 8080)
    location /admin/ {
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
