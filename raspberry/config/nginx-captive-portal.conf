# Configuration nginx pour Captive Portal Android
# À ajouter dans la config nginx principale pour rediriger les requêtes de détection Android

server {
    listen 80;
    server_name neopro.local 192.168.4.1;

    # Endpoints de détection de connectivité Android
    # Android envoie des requêtes GET vers ces URLs pour vérifier la connexion Internet

    # Android (Google)
    location /generate_204 {
        return 204;
    }

    # Android (ancienne version)
    location /gen_204 {
        return 204;
    }

    # Chrome Captive Portal detection
    location /connecttest.txt {
        return 200 "Microsoft Connect Test";
        add_header Content-Type text/plain;
    }

    # Windows Captive Portal
    location /ncsi.txt {
        return 200 "Microsoft NCSI";
        add_header Content-Type text/plain;
    }

    # Redirection alternative : envoyer vers la page de login
    # Si on veut forcer l'ouverture du navigateur Android
    # location /generate_204 {
    #     return 302 http://192.168.4.1/login;
    # }

    # Fichiers statiques : retourner 404 si manquant (pas de fallback HTML)
    location ~* \.(js|mjs|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|json|map)$ {
        root /home/pi/neopro/webapp;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Routes normales de l'application (fallback SPA uniquement pour les routes)
    location / {
        root /home/pi/neopro/webapp;
        try_files $uri $uri/ /index.html;
    }

    location /configuration.json {
        root /home/pi/neopro;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /videos/ {
        alias /home/pi/neopro/videos/;
    }

    location /thumbnails/ {
        alias /home/pi/neopro/thumbnails/;
    }
}
