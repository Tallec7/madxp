# Neopro — Désactiver le power management interne du driver RTL8192EU
# Sans ça, le driver coupe le radio périodiquement → déconnexions WiFi en prod
# Déployé automatiquement via OTA dans /etc/modprobe.d/
#
# rtw_power_mgnt=0 : désactive le power save du chipset WiFi (PS-Poll/UAPSD)
# rtw_enusbss=0    : désactive le USB selective suspend côté driver
options rtl8xxxu rtw_power_mgnt=0 rtw_enusbss=0
