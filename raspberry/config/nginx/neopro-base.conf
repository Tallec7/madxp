# Configuration Nginx de base pour Pi Neopro (sans proxy cache HLS)
# Source de vérité unique — `install.sh::configure_nginx` la copie dans
# `/etc/nginx/sites-available/neopro` (cf. Phase 6 gap closure plan 05).
# `build-raspberry.sh` propage ce fichier dans le tarball OTA.
#
# Installation manuelle (debug uniquement) :
#   sudo cp /home/pi/neopro/config/nginx/neopro-base.conf /etc/nginx/sites-available/neopro
#   sudo ln -sf /etc/nginx/sites-available/neopro /etc/nginx/sites-enabled/neopro
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name neopro.local 192.168.4.1;

    root /home/pi/neopro/webapp;
    index index.html;

    # Logs
    access_log /home/pi/neopro/logs/nginx-access.log;
    error_log /home/pi/neopro/logs/nginx-error.log;

    # ========================================================================
    # CAPTIVE PORTAL - Endpoints de détection de connectivité
    # ========================================================================

    # Android (Google) - Principal check
    location /generate_204 { return 204; }
    location /gen_204 { return 204; }

    # Chrome Captive Portal detection
    location /connecttest.txt {
        return 200 "Microsoft Connect Test";
        add_header Content-Type text/plain;
    }

    # Windows Captive Portal
    location /ncsi.txt {
        return 200 "Microsoft NCSI";
        add_header Content-Type text/plain;
    }

    # Apple iOS Captive Portal — servir la page brandée si disponible (ADR-079)
    # Si captive-portal.html présent : servi (UI brandée Neopro).
    # Sinon : fallback "Success" minimal pour ne pas casser la détection iOS.
    location = /hotspot-detect.html {
        try_files /captive-portal.html @captive_fallback;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /library/test/success.html {
        try_files /captive-portal.html @captive_fallback;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location @captive_fallback {
        default_type text/html;
        return 200 "<!DOCTYPE html><html><head><title>Success</title></head><body>Success</body></html>";
    }
    location = /captive-portal.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fire OS captive probe (Phase 6 CAPTIVE-01 + Phase 10 CAPTIVE-05)
    # Phase 10 : retourner 302 (au lieu de 200 Success) pour déclencher
    # CaptivePortalLauncher natif Fire OS — sans cela, Silk ne s'ouvre pas
    # automatiquement (le bénévole devait lancer Silk manuellement).
    # Voir .planning/phases/10-captive-auto/10-RESEARCH.md
    location = /kindle-wifi/wifistub.html {
        return 302 http://$host/kindle-wifi/wifiredirect.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fire OS captive portal target (Phase 10 - CAPTIVE-05/06)
    # Endpoint chargé par CaptivePortalLauncher après détection du portail.
    # Redirige vers la racine Pi → Angular bootstrap router résout via /api/captive/whoami
    # (page Neopro plein écran si MAC assignée, page d'attente sinon).
    location = /kindle-wifi/wifiredirect.html {
        return 302 http://192.168.4.1/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Captive whoami endpoint — proxy vers raspberry/server :3000 (Phase 6 - CAPTIVE-02)
    location = /api/captive/whoami {
        proxy_pass http://localhost:3000/api/captive/whoami;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # CRITIQUE : transmettre l'IP cliente réelle (sans X-Real-IP, Express voit 127.0.0.1)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Page d'attente Fire Stick (Phase 6 - CAPTIVE-03)
    location = /captive/wait {
        root /home/pi/neopro/webapp;
        try_files /firestick-wait.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ========================================================================
    # APPLICATION PRINCIPALE
    # ========================================================================

    # index.html — jamais mis en cache (garantit le chargement du dernier build Angular)
    # Les JS/CSS ont des content-hash dans leurs noms, donc immutables par design.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Fichiers statiques Angular (JS/CSS/fonts/images) — cache longue durée
    # Les content-hash dans les noms de fichiers garantissent l'invalidation automatique
    location ~* \.(js|mjs|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Application Angular (fallback SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers vidéos — proxy vers admin-server pour normalisation Unicode des
    # noms de fichiers (accents, espaces). `alias` direct casserait les paths
    # avec caractères non-ASCII. Cache-Control immutable : un nom = un contenu
    # (replace cloud invalide via nouveau nom) → receivers LAN (Fire Stick,
    # smart TV) jouent en cache local sans refetch HTTP/WiFi.
    location /videos/ {
        proxy_pass http://127.0.0.1:8080/videos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Chrome PNA (Private Network Access) headers — Chromium 104+ refuse
        # les fetchs vers réseau privé sans ces headers depuis http://neopro.local.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Private-Network "true";
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Private-Network "true" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Vidéos secondaires (variantes dual-display) — ADR-033
    location /videos-secondary/ {
        proxy_pass http://127.0.0.1:8080/videos-secondary/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Private-Network "true";
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Private-Network "true" always;
    }

    # Thumbnails (proxifiés depuis admin-server :8080 pour normalisation Unicode)
    # ^~ stoppe l'évaluation des regex (sinon ~* \.jpg$ prend la main et try_files
    # cherche dans webapp/ root → 404 car les thumbnails sont dans /home/pi/neopro/thumbnails/)
    location ^~ /thumbnails/ {
        proxy_pass http://127.0.0.1:8080/thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Private-Network "true" always;
    }

    # Stream HLS (live score incrusté)
    location /hls/ {
        alias /var/www/neopro/hls/;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # Proxy Socket.IO
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Proxy Admin interface (port 8080)
    location /admin/ {
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
