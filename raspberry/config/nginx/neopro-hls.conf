# Configuration Nginx pour le streaming HLS Neopro
# À inclure dans le fichier de configuration principal Nginx
#
# Installation:
#   sudo ln -s /home/pi/neopro/config/nginx/neopro-hls.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# E-23 US-23.3.3: Proxy cache for video pre-loading
# Caches video responses from the admin server (port 8080) for faster playback
# Cache zone: 256MB on disk, 10m keys in shared memory, inactive eviction after 7d
proxy_cache_path /var/cache/nginx/neopro_videos levels=1:2 keys_zone=neopro_videos:10m
                 max_size=256m inactive=7d use_temp_path=off;

# Serveur HLS sur le port 80 (ou dans un bloc location existant)
server {
    listen 80;
    server_name neopro.local localhost;

    # Racine de l'application web
    root /home/pi/neopro/webapp;
    index index.html;

    # Stream HLS
    location /hls/ {
        alias /var/www/neopro/hls/;

        # Headers CORS pour permettre l'accès depuis n'importe quelle origine
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';

        # Désactiver le cache pour le streaming live
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff;

        # Types MIME pour HLS
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
    }

    # API et Socket.IO vers le serveur Node.js
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vidéos statiques depuis le serveur admin (cached — E-23 US-23.3.3)
    location /videos/ {
        proxy_pass http://127.0.0.1:8080/videos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # E-23 US-23.3.3: Proxy cache — serve videos from nginx disk cache
        proxy_cache neopro_videos;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Vidéos secondaires (variantes dual-display) depuis le serveur admin (cached)
    location /videos-secondary/ {
        proxy_pass http://127.0.0.1:8080/videos-secondary/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache neopro_videos;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Thumbnails depuis le serveur admin (cached — E-23 US-23.3.3)
    location /thumbnails/ {
        proxy_pass http://127.0.0.1:8080/thumbnails/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Reuse same cache zone as videos
        proxy_cache neopro_videos;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # index.html — jamais mis en cache (garantit le chargement du dernier build Angular)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Profils multi-config — jamais caches (mis a jour par sync_profiles)
    location /profiles/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Configuration active — jamais cachee (= exact match gagne sur la regex)
    location = /configuration.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Fichiers statiques : retourner 404 si manquant (pas de fallback HTML)
    location ~* \.(js|mjs|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|json|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Application Angular (fallback SPA uniquement pour les routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
