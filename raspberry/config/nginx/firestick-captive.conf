# Fire Stick / Fire OS — répond aux Hosts Amazon hijackés par dnsmasq
#
# Phase 14 (offline Pi support — incident 2026-05-09) :
#   /generate_204 retourne 204 (et plus 302). Sur Fire OS récents,
#   la réponse 302 sur la sonde NCSI bloque l'écran setup WiFi avec
#   "Connecté sans Internet" — le device refuse de poursuivre.
#   204 = "internet OK" → Fire OS valide la connexion sans friction.
#
# Conséquence : le CaptivePortalLauncher Fire OS ne s'auto-lance plus.
# L'utilisateur ouvre Silk → tape `neopro.local` → la page Neopro charge.
# L'auto-launch sera ré-activé via APK TWA Phase 13 (sideload).
#
# Le `wifistub.html` reste sur 302 → wifiredirect.html, et wifiredirect
# reste sur 302 → 192.168.4.1, pour que les Fire OS qui sondent ces
# endpoints (versions plus anciennes) continuent d'arriver sur Neopro.
server {
    listen 80;
    listen [::]:80;
    server_name firetvcaptiveportal.com spectrum.s3.amazonaws.com;
    access_log /home/pi/neopro/logs/nginx-firestick-access.log;

    # Phase 14 : 204 = "internet OK" → Fire OS accepte le réseau sans
    # afficher "no internet" sur l'écran setup WiFi.
    location = /generate_204 {
        return 204;
    }

    # spectrum.s3.amazonaws.com/kindle-wifi/wifistub.html → 302
    # Fire OS ancien : déclenche CaptivePortalLauncher → wifiredirect → 192.168.4.1
    location = /kindle-wifi/wifistub.html {
        return 302 http://$host/kindle-wifi/wifiredirect.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # kindle-wifi/wifiredirect.html → page captive Pi
    location = /kindle-wifi/wifiredirect.html {
        return 302 http://192.168.4.1/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # catch-all → page captive Pi (utile aussi pour le wildcard DNS hijack
    # de dnsmasq : tout domaine inconnu résout vers 192.168.4.1, et nginx
    # le redirige vers la page Neopro).
    location / {
        return 302 http://192.168.4.1/;
    }
}
