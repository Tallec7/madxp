# POC Fire Stick — répond aux Hosts Amazon hijackés
# Phase 10 : generate_204 retourne 302 pour déclencher CaptivePortalLauncher Fire OS
# (le Fire Stick sonde generate_204, pas wifistub.html — cf. logs nginx-firestick-access.log)
server {
    listen 80;
    listen [::]:80;
    server_name firetvcaptiveportal.com spectrum.s3.amazonaws.com;
    access_log /home/pi/neopro/logs/nginx-firestick-access.log;

    # firetvcaptiveportal.com/generate_204 → 302 (Phase 10 CAPTIVE-05)
    # Fire OS sonde generate_204 (pas wifistub.html) toutes les 5min.
    # 204 = "internet OK" → pas de portail. 302 = portail détecté → CaptivePortalLauncher.
    # Ne concerne que les appareils Amazon (seuls à sonder firetvcaptiveportal.com).
    location = /generate_204 {
        return 302 http://192.168.4.1/;
    }

    # spectrum.s3.amazonaws.com/kindle-wifi/wifistub.html → 302 (Phase 10 CAPTIVE-05)
    # Retourner 302 (pas 200) pour déclencher CaptivePortalLauncher natif Fire OS
    location = /kindle-wifi/wifistub.html {
        return 302 http://$host/kindle-wifi/wifiredirect.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # kindle-wifi/wifiredirect.html → page captive Pi (Phase 10 CAPTIVE-05/06)
    location = /kindle-wifi/wifiredirect.html {
        return 302 http://192.168.4.1/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # catch-all → page captive Pi (fallback CAPTIVE-07)
    location / {
        return 302 http://192.168.4.1/;
    }
}
