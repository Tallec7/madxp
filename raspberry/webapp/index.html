<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Neopro</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        --neo-primary: #3b82f6;
        --neo-bg: #0f172a;
        --neo-surface: #1e293b;
        --neo-border: #334155;
        --neo-text: #f1f5f9;
        --neo-muted: #94a3b8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--neo-bg);
        color: var(--neo-text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        gap: 32px;
      }
      .hero {
        text-align: center;
      }
      .logo {
        height: 48px;
        width: auto;
      }
      .cta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        max-width: 360px;
        padding: 18px 24px;
        background: var(--neo-primary);
        color: white;
        border-radius: 14px;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      .cta:hover {
        opacity: 0.9;
      }
      .cta-icon {
        font-size: 24px;
      }
      .secondary-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background: var(--neo-surface);
        border: 1px solid var(--neo-border);
        border-radius: 10px;
        color: var(--neo-muted);
        text-decoration: none;
        font-size: 14px;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .secondary-link:hover {
        border-color: var(--neo-primary);
        color: var(--neo-text);
      }
      footer {
        text-align: center;
        padding: 16px;
        color: var(--neo-muted);
        font-size: 12px;
        border-top: 1px solid var(--neo-border);
      }
      footer a {
        color: var(--neo-muted);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--neo-text);
      }
      .sep {
        margin: 0 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <img class="logo" src="/neopro-logo-white.png" alt="Neopro" />
      </div>

      <a class="cta" href="/remote">
        <span class="cta-icon">&#127918;</span>
        <span>Ouvrir la télécommande</span>
      </a>

      <a class="secondary-link" href="/tv?displayType=secondary">
        <span>&#128250;</span>
        <span>Afficher l'écran TV sur ce navigateur</span>
      </a>
    </main>

    <footer>
      <a href="/admin/">Administration</a>
      <span class="sep">&middot;</span>
      <span>Neopro &copy; 2024-2026</span>
    </footer>
  </body>
</html>
