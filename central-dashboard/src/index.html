<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>NEOPRO - Dashboard Central</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- frame-ancestors must be provided via HTTP headers (see render.yaml) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval';
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 img-src 'self' data: blob: https:;
                 font-src 'self' data: https://fonts.gstatic.com;
                 media-src 'self' blob: https://kalonpartners.bzh https://neopro-central-production.up.railway.app;
                 connect-src 'self'
                              http://localhost:3001 ws://localhost:3001
                              https://neopro-admin.kalonpartners.bzh wss://neopro-admin.kalonpartners.bzh
                              https://neopro-central-production.up.railway.app wss://neopro-central-production.up.railway.app
                              https://api.bworlds.co;
                 frame-src 'self'
                              http://localhost:3001
                              https://neopro-central-production.up.railway.app;
                 base-uri 'self';"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- ADR-060 Phase 3 couche 3 — PWA manifest + theme -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b1020" />
  </head>
  <body>
    <app-root></app-root>
    <!-- PWA temporairement désactivée — kill-switch : désinscrit les SW existants et vide les caches -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          })
          .catch(function () {
            /* noop */
          });
        if (window.caches && caches.keys) {
          caches
            .keys()
            .then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            })
            .catch(function () {
              /* noop */
            });
        }
      }
    </script>
  </body>
</html>
