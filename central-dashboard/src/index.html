<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>NEOPRO - Dashboard Central</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- frame-ancestors must be provided via HTTP headers (see render.yaml) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval';
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 img-src 'self' data: blob: https:;
                 font-src 'self' data: https://fonts.gstatic.com;
                 media-src 'self' blob: data: https://kalonpartners.bzh https://*.kalonpartners.bzh https://neopro-central-production.up.railway.app;
                 connect-src 'self'
                              http://localhost:3001 ws://localhost:3001
                              https://neopro-admin.kalonpartners.bzh wss://neopro-admin.kalonpartners.bzh
                              https://api-staging.kalonpartners.bzh wss://api-staging.kalonpartners.bzh
                              https://neopro-central-production.up.railway.app wss://neopro-central-production.up.railway.app
                              https://api.bworlds.co;
                 frame-src 'self'
                              http://localhost:3001
                              https://api-staging.kalonpartners.bzh
                              https://neopro-central-production.up.railway.app;
                 base-uri 'self';"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- ADR-075 — Google Fonts curated pour le Template Studio (preview Remotion) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo+Black&family=Barlow:wght@400;600;800&family=Bebas+Neue&family=Bungee&family=Caveat:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;600;800&family=Figtree:wght@400;600;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Lora:wght@400;600;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600;800&family=Nunito:wght@400;600;800&family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;600;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;600;800&family=Poppins:wght@400;600;800&family=Raleway:wght@400;600;800&family=Roboto:wght@400;700&family=Russo+One&family=Space+Mono:wght@400;700&family=Staatliches&family=Teko:wght@400;600;700&family=Work+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <!-- ADR-060 Phase 3 couche 3 — PWA manifest + theme -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b1020" />
  </head>
  <body>
    <app-root></app-root>
    <!-- PWA Phase A — SW installable (sans cache) pour activer le prompt "Installer l'app" -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {
            /* Installation PWA optionnelle : si le SW échoue, l'app fonctionne normalement */
          });
        });
      }
    </script>
  </body>
</html>
